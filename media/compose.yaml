name: media

services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    ports:
      - "${ABS_PORT}:80"
    volumes:
      - ../homelab-data/audiobookshelf/config:/config
      - ../homelab-data/audiobookshelf/metadata:/metadata
      - ../homelab-data/audiobooks:/audiobooks
      - ../homelab-data/podcasts:/podcasts
    restart: unless-stopped
    networks:
      - homelab_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80" ]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: syncthing
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ../homelab-data/syncthing/config:/config
      - ../homelab-data/syncthing/data:/data1
    ports:
      - "${SYNCTHING_GUI_PORT}:8384"
      - "${SYNCTHING_TRANS_TCP_PORT}:22000/tcp"
      - "${SYNCTHING_TRANS_UDP_PORT}:22000/udp"
      - "${SYNCTHING_DISCOVERY_PORT}:21027/udp"
    restart: unless-stopped
    networks:
      - homelab_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8384/rest/system/ping" ]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  ryot:
    image: ghcr.io/ignisda/ryot:latest
    container_name: ryot
    restart: unless-stopped
    depends_on:
      ryot_db:
        condition: service_healthy
    environment:
      - TZ=Europe/London
      - DATABASE_URL=postgres://${RYOT_DB_USER}:${RYOT_DB_PASS}@ryot_db:5432/ryot
      - WEB_INSECURE_COOKIE=true
      - SERVER_ADMIN_ACCESS_TOKEN=${SERVER_ADMIN_ACCESS_TOKEN}
      - MOVIES_AND_SHOWS_TMDB_ACCESS_TOKEN=${MOVIES_AND_SHOWS_TMDB_ACCESS_TOKEN}
      - SERVER_IMPORTER_TRAKT_CLIENT_ID=${SERVER_IMPORTER_TRAKT_CLIENT_ID}
    volumes:
      - ../homelab-data/ryot/data:/data
    ports:
      - "${RYOT_PORT}:8000"
    networks:
      - homelab_net
      - media_backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 256M

  ryot_db:
    image: postgres:16-alpine
    container_name: ryot_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${RYOT_DB_USER}
      - POSTGRES_PASSWORD=${RYOT_DB_PASS}
      - POSTGRES_DB=ryot
      - TZ=Europe/London
    volumes:
      - ../homelab-data/ryot/db:/var/lib/postgresql/data
    networks:
      - media_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M
        reservations:
          cpus: '0.05'
          memory: 256M

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Europe/London
      - WEBUI_PORT=${QBITTORRENT_WEBUI_PORT}
      - TORRENTING_PORT=${QBITTORRENT_TCP_PORT}
      - WEBUI_ADDRESS=0.0.0.0
      - WEBUI_USERNAME=${QBITTORRENT_WEBUI_USER}
    volumes:
      - ../homelab-data/qbittorrent/config:/config
      - ../homelab-data/qbittorrent-downloads:/downloads
    ports:
      - "${QBITTORRENT_WEBUI_PORT}:${QBITTORRENT_WEBUI_PORT}"
      - "${QBITTORRENT_TCP_PORT}:${QBITTORRENT_TCP_PORT}"
      - "${QBITTORRENT_UDP_PORT}:${QBITTORRENT_UDP_PORT}/udp"
    restart: unless-stopped
    networks:
      - homelab_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${QBITTORRENT_WEBUI_PORT}" ]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 256M

  audiobookbay-downloader:
    image: ghcr.io/jamesry96/audiobookbay-automated:latest
    ports:
      - "${ABB_PORT}:5078"
    container_name: audiobookbay-downloader
    depends_on:
      qbittorrent:
        condition: service_healthy
    environment:
      - DOWNLOAD_CLIENT=qbittorrent
      - DL_SCHEME=http
      - DL_HOST=qbittorrent
      - DL_PORT=${QBITTORRENT_WEBUI_PORT}
      - DL_USERNAME=${QBITTORRENT_WEBUI_USER}
      - DL_PASSWORD=${QBITTORRENT_WEBUI_PASS}
      - DL_CATEGORY=abb-downloader
      - SAVE_PATH_BASE=/downloads
      - ABB_HOSTNAME=audiobookbay.is
      - PAGE_LIMIT=5
      - FLASK_PORT=5078
      - NAV_LINK_NAME=Open Audiobook Player
      - NAV_LINK_URL=https://audiobookshelf.andreasmaita.com/
      - VERIFY_WEBUI_CERTIFICATE=False
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5078"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - homelab_net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 128M

networks:
  homelab_net:
    external: true
  media_backend:
    internal: true
