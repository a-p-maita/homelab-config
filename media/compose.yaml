name: media

services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    ports:
      - "${ABS_PORT}:80"
    volumes:
      - ../homelab-data/audiobookshelf/config:/config
      - ../homelab-data/audiobookshelf/metadata:/metadata
      - ../homelab-data/audiobooks:/audiobooks
      - ../homelab-data/podcasts:/podcasts
    restart: unless-stopped
    networks:
      - homelab_net
    healthcheck:
      # node:alpine has no curl — use BusyBox wget
      test: ["CMD-SHELL", "wget -qO- http://localhost:80 > /dev/null"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  ryot:
    image: ghcr.io/ignisda/ryot:latest
    container_name: ryot
    restart: unless-stopped
    depends_on:
      ryot_db:
        condition: service_healthy
    environment:
      - TZ=Europe/London
      - DATABASE_URL=postgres://${RYOT_DB_USER}:${RYOT_DB_PASS}@ryot_db:5432/ryot
      - WEB_INSECURE_COOKIE=true
      - SERVER_ADMIN_ACCESS_TOKEN=${SERVER_ADMIN_ACCESS_TOKEN}
      - MOVIES_AND_SHOWS_TMDB_ACCESS_TOKEN=${MOVIES_AND_SHOWS_TMDB_ACCESS_TOKEN}
      - SERVER_IMPORTER_TRAKT_CLIENT_ID=${SERVER_IMPORTER_TRAKT_CLIENT_ID}
    volumes:
      - ../homelab-data/ryot/data:/data
    ports:
      - "${RYOT_PORT}:8000"
    networks:
      - homelab_net
      - media_backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  ryot_db:
    image: postgres:16-alpine
    container_name: ryot_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${RYOT_DB_USER}
      - POSTGRES_PASSWORD=${RYOT_DB_PASS}
      - POSTGRES_DB=ryot
      - TZ=Europe/London
    volumes:
      - ../homelab-data/ryot/db:/var/lib/postgresql/data
    networks:
      - media_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M
        reservations:
          cpus: '0.05'
          memory: 256M

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Europe/London
      - WEBUI_PORT=${QBITTORRENT_WEBUI_PORT}
      - TORRENTING_PORT=${QBITTORRENT_TCP_PORT}
      - WEBUI_ADDRESS=0.0.0.0
      - WEBUI_USERNAME=${QBITTORRENT_WEBUI_USER}
    volumes:
      - ../homelab-data/qbittorrent/config:/config
      - ../homelab-data/qbittorrent-downloads:/downloads
      - ../homelab-data/audiobooks:/audiobooks
    ports:
      - "${QBITTORRENT_WEBUI_PORT}:${QBITTORRENT_WEBUI_PORT}"
      - "${QBITTORRENT_TCP_PORT}:${QBITTORRENT_TCP_PORT}"
      - "${QBITTORRENT_UDP_PORT}:${QBITTORRENT_UDP_PORT}/udp"
    restart: unless-stopped
    networks:
      - homelab_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${QBITTORRENT_WEBUI_PORT}" ]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 256M

  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Europe/London
      - AUTO_UPDATE=true
    volumes:
      - ../homelab-data/jackett/config:/config
      - ../homelab-data/jackett/downloads:/downloads
    ports:
      - "${JACKETT_PORT}:9117"
    restart: unless-stopped
    networks:
      - homelab_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9117"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 128M

  audiobookbay-downloader:
    image: ghcr.io/moonblade/audiobookbay-downloader:latest
    ports:
      - "${ABB_PORT}:9000"
    container_name: audiobookbay-downloader
    depends_on:
      qbittorrent:
        condition: service_healthy
      jackett:
        condition: service_healthy
    environment:
      - JACKETT_API_URL=http://jackett:9117/api/v2.0/indexers/audiobookbay/results
      - JACKETT_API_KEY=${JACKETT_API_KEY}
      - TORRENT_CLIENT_TYPE=qbittorrent
      - QBITTORRENT_URL=http://qbittorrent:${QBITTORRENT_WEBUI_PORT}
      - QBITTORRENT_USERNAME=${QBITTORRENT_WEBUI_USER}
      - QBITTORRENT_PASSWORD=${QBITTORRENT_WEBUI_PASS}
      # Category whose save path in qBittorrent should be set to /audiobooks
      - QBITTORRENT_CATEGORY=abb-downloader
      # Persist app config (Jackett API key, settings changed via UI) across restarts
      - DB_PATH=/app/data
      # Disable auto-deletion of files — audiobooks should live in /audiobooks permanently
      - DELETE_AFTER_DAYS=365
      - STRICTLY_DELETE_AFTER_DAYS=365
    volumes:
      - ../homelab-data/audiobookbay-downloader:/app/data
    restart: unless-stopped
    healthcheck:
      # image is Python-based — no curl available, use Python urllib
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:9000')\""]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - homelab_net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 128M

  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    user: "${PUID}:${PGID}"
    environment:
      - ND_SCANSCHEDULE=1h
      - ND_LOGLEVEL=info
      # Extend session lifetime so Feishin stays logged in
      - ND_SESSIONTIMEOUT=72h
      - ND_BASEURL=
    volumes:
      - ../homelab-data/navidrome/data:/data
      - ../homelab-data/music:/music:ro
    ports:
      - "${NAVIDROME_PORT}:4533"
    restart: unless-stopped
    networks:
      - homelab_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4533/ping > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M

  feishin:
    image: ghcr.io/jeffvli/feishin:latest
    container_name: feishin
    environment:
      # Pre-lock to Navidrome — users just log in with their Navidrome credentials
      - SERVER_NAME=Homelab
      - SERVER_TYPE=navidrome
      # Must be the public URL — browser connects directly to Navidrome from client side
      - SERVER_URL=${NAVIDROME_EXTERNAL_URL}
      - SERVER_LOCK=true
      - ANALYTICS_DISABLED=true
    ports:
      - "${FEISHIN_PORT}:9180"
    restart: unless-stopped
    networks:
      - homelab_net
    depends_on:
      navidrome:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9180 > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Europe/London
    volumes:
      - ../homelab-data/lidarr/config:/config
      # Shared with qBittorrent — same host path enables hardlinks during import
      - ../homelab-data/qbittorrent-downloads:/downloads
      - ../homelab-data/music:/music
    ports:
      - "${LIDARR_PORT}:8686"
    restart: unless-stopped
    networks:
      - homelab_net
    depends_on:
      qbittorrent:
        condition: service_healthy
      jackett:
        condition: service_healthy
    healthcheck:
      # /ping responds without API key
      test: ["CMD", "curl", "-f", "http://localhost:8686/ping"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  slskd:
    image: slskd/slskd:latest
    container_name: slskd
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - SLSKD_REMOTE_CONFIGURATION=false
      # slskd env vars override YAML — fixes ${VAR} literal issue in slskd.yml
      - SLSKD_SOULSEEK_USERNAME=${SLSKD_USERNAME}
      - SLSKD_SOULSEEK_PASSWORD=${SLSKD_PASSWORD}
      - SLSKD_WEB_AUTHENTICATION_USERNAME=${SLSKD_USERNAME}
      - SLSKD_WEB_AUTHENTICATION_PASSWORD=${SLSKD_PASSWORD}
    volumes:
      # slskd.yml must be seeded from config-templates/slskd/slskd.yml before first boot
      - ../homelab-data/slskd:/app
      - ../homelab-data/music:/music
    ports:
      - "${SLSKD_PORT}:5030"
      # Soulseek P2P port — expose for better download queue priority
      - "${SLSKD_P2P_PORT}:50300"
    restart: unless-stopped
    networks:
      - homelab_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5030 > /dev/null"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M

networks:
  homelab_net:
    external: true
  media_backend:
    internal: true
