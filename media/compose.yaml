name: media

services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    ports:
      - "${ABS_PORT}:80"
    volumes:
      - ../homelab-data/audiobookshelf/config:/config
      - ../homelab-data/audiobookshelf/metadata:/metadata
      - ../homelab-data/audiobooks:/audiobooks
      - ../homelab-data/podcasts:/podcasts
    restart: unless-stopped
    networks:
      - homelab_net
    healthcheck:
      # node:alpine has no curl — use BusyBox wget
      test: ["CMD-SHELL", "wget -qO- http://localhost:80 > /dev/null"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  ryot:
    image: ghcr.io/ignisda/ryot:latest
    container_name: ryot
    restart: unless-stopped
    depends_on:
      ryot_db:
        condition: service_healthy
    environment:
      - TZ=Europe/London
      - DATABASE_URL=postgres://${RYOT_DB_USER}:${RYOT_DB_PASS}@ryot_db:5432/ryot
      - WEB_INSECURE_COOKIE=true
      - SERVER_ADMIN_ACCESS_TOKEN=${SERVER_ADMIN_ACCESS_TOKEN}
      - MOVIES_AND_SHOWS_TMDB_ACCESS_TOKEN=${MOVIES_AND_SHOWS_TMDB_ACCESS_TOKEN}
      - SERVER_IMPORTER_TRAKT_CLIENT_ID=${SERVER_IMPORTER_TRAKT_CLIENT_ID}
    volumes:
      - ../homelab-data/ryot/data:/data
    ports:
      - "${RYOT_PORT}:8000"
    networks:
      - homelab_net
      - media_backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  ryot_db:
    image: postgres:16-alpine
    container_name: ryot_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${RYOT_DB_USER}
      - POSTGRES_PASSWORD=${RYOT_DB_PASS}
      - POSTGRES_DB=ryot
      - TZ=Europe/London
    volumes:
      - ../homelab-data/ryot/db:/var/lib/postgresql/data
    networks:
      - media_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M
        reservations:
          cpus: '0.05'
          memory: 256M

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Europe/London
      - WEBUI_PORT=${QBITTORRENT_WEBUI_PORT}
      - TORRENTING_PORT=${QBITTORRENT_TCP_PORT}
      - WEBUI_ADDRESS=0.0.0.0
      - WEBUI_USERNAME=${QBITTORRENT_WEBUI_USER}
    volumes:
      - ../homelab-data/qbittorrent/config:/config
      - ../homelab-data/qbittorrent-downloads:/downloads
      - ../homelab-data/audiobooks:/audiobooks
    ports:
      - "${QBITTORRENT_WEBUI_PORT}:${QBITTORRENT_WEBUI_PORT}"
      - "${QBITTORRENT_TCP_PORT}:${QBITTORRENT_TCP_PORT}"
      - "${QBITTORRENT_UDP_PORT}:${QBITTORRENT_UDP_PORT}/udp"
    restart: unless-stopped
    networks:
      - homelab_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${QBITTORRENT_WEBUI_PORT}" ]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 256M

  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Europe/London
      - AUTO_UPDATE=true
    volumes:
      - ../homelab-data/jackett/config:/config
      - ../homelab-data/jackett/downloads:/downloads
    ports:
      - "${JACKETT_PORT}:9117"
    restart: unless-stopped
    networks:
      - homelab_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9117"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 128M

  audiobookbay-downloader:
    image: ghcr.io/moonblade/audiobookbay-downloader:latest
    ports:
      - "${ABB_PORT}:9000"
    container_name: audiobookbay-downloader
    depends_on:
      qbittorrent:
        condition: service_healthy
      jackett:
        condition: service_healthy
    environment:
      - JACKETT_API_URL=http://jackett:9117/api/v2.0/indexers/audiobookbay/results
      - JACKETT_API_KEY=${JACKETT_API_KEY}
      - TORRENT_CLIENT_TYPE=qbittorrent
      - QBITTORRENT_URL=http://qbittorrent:${QBITTORRENT_WEBUI_PORT}
      - QBITTORRENT_USERNAME=${QBITTORRENT_WEBUI_USER}
      - QBITTORRENT_PASSWORD=${QBITTORRENT_WEBUI_PASS}
      # Category whose save path in qBittorrent should be set to /audiobooks
      - QBITTORRENT_CATEGORY=abb-downloader
      # Persist app config (Jackett API key, settings changed via UI) across restarts
      - DB_PATH=/app/data
      # Disable auto-deletion of files — audiobooks should live in /audiobooks permanently
      - DELETE_AFTER_DAYS=365
      - STRICTLY_DELETE_AFTER_DAYS=365
    volumes:
      - ../homelab-data/audiobookbay-downloader:/app/data
    restart: unless-stopped
    healthcheck:
      # image is Python-based — no curl available, use Python urllib
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:9000')\""]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - homelab_net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 128M

networks:
  homelab_net:
    external: true
  media_backend:
    internal: true
