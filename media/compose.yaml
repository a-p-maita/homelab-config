name: media

services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    ports:
      # OLD: - "${ABS_PORT}:80"
      - "13378:80"   # <--- Standard ABS Port
    volumes:
      - ${HOME}/homelab-data/audiobookshelf/config:/config
      - ${HOME}/homelab-data/audiobookshelf/metadata:/metadata
      - ${HOME}/homelab-data/audiobooks:/audiobooks
    restart: unless-stopped
    networks:
      - homelab_net

  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: syncthing
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${HOME}/homelab-data/syncthing/config:/config
      - ${HOME}/homelab-data/syncthing/data:/data1
    ports:
      # OLD: - "${SYNCTHING_GUI_PORT}:8384"
      - "8384:8384"    # <--- Standard Web UI
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    restart: unless-stopped
    networks:
      - homelab_net

  ryot:
    image: ghcr.io/ignisda/ryot:latest
    container_name: ryot
    restart: unless-stopped
    depends_on:
      - ryot_db
    environment:
      - TZ=Europe/London
      - DATABASE_URL=postgres://${RYOT_DB_USER}:${RYOT_DB_PASS}@ryot_db:5432/ryot
      - WEB_INSECURE_COOKIE=true
      - SERVER_ADMIN_ACCESS_TOKEN=${SERVER_ADMIN_ACCESS_TOKEN}
      - MOVIES_AND_SHOWS_TMDB_ACCESS_TOKEN=${MOVIES_AND_SHOWS_TMDB_ACCESS_TOKEN}
      - SERVER_IMPORTER_TRAKT_CLIENT_ID=${SERVER_IMPORTER_TRAKT_CLIENT_ID}
    volumes:
      - ${HOME}/homelab-data/ryot/data:/data
    ports:
      # Now both internal and external
      - "10040:8000"
    networks:
      - homelab_net

  ryot_db:
    image: postgres:16-alpine
    container_name: ryot_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${RYOT_DB_USER}
      - POSTGRES_PASSWORD=${RYOT_DB_PASS}
      - POSTGRES_DB=ryot
      - TZ=Europe/London
    volumes:
      - ${HOME}/homelab-data/ryot/db:/var/lib/postgresql/data
    networks:
      - homelab_net

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Europe/London
      - WEBUI_PORT=8080
    volumes:
      - ${HOME}/homelab-data/qbittorrent/config:/config
      # This maps your host downloads folder to the container's /downloads folder
      - ${HOME}/homelab-data/downloads:/downloads
    ports:
      - "8080:8080"
      # These ports are required for standard torrent traffic (TCP/UDP)
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped
    networks:
      - homelab_net

networks:
  homelab_net:
    external: true
