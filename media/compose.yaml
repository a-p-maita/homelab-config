name: media

services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    ports:
      - "${ABS_PORT}:80"
    volumes:
      - ../homelab-data/audiobookshelf/config:/config
      - ../homelab-data/audiobookshelf/metadata:/metadata
      - ../homelab-data/audiobooks:/audiobooks
    restart: unless-stopped
    networks:
      - homelab_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80" ]
      interval: 1m
      timeout: 10s
      retries: 3

  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: syncthing
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ../homelab-data/syncthing/config:/config
      - ../homelab-data/syncthing/data:/data1
    ports:
      - "${SYNCTHING_GUI_PORT}:8384"
      - "${SYNCTHING_TRANS_TCP_PORT}:22000/tcp"
      - "${SYNCTHING_TRANS_UDP_PORT}:22000/udp"
      - "${SYNCTHING_DISCOVERY_PORT}:21027/udp"
    restart: unless-stopped
    networks:
      - homelab_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8384/rest/system/ping" ]
      interval: 1m
      timeout: 10s
      retries: 3

  ryot:
    image: ghcr.io/ignisda/ryot:latest
    container_name: ryot
    restart: unless-stopped
    depends_on:
      - ryot_db
    environment:
      - TZ=Europe/London
      - DATABASE_URL=postgres://${RYOT_DB_USER}:${RYOT_DB_PASS}@ryot_db:5432/ryot
      - WEB_INSECURE_COOKIE=true
      - SERVER_ADMIN_ACCESS_TOKEN=${SERVER_ADMIN_ACCESS_TOKEN}
      - MOVIES_AND_SHOWS_TMDB_ACCESS_TOKEN=${MOVIES_AND_SHOWS_TMDB_ACCESS_TOKEN}
      - SERVER_IMPORTER_TRAKT_CLIENT_ID=${SERVER_IMPORTER_TRAKT_CLIENT_ID}
    volumes:
      - ../homelab-data/ryot/data:/data
    ports:
      - "${RYOT_PORT}:8000"
    networks:
      - homelab_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 1m
      timeout: 10s
      retries: 3

  ryot_db:
    image: postgres:16-alpine
    container_name: ryot_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${RYOT_DB_USER}
      - POSTGRES_PASSWORD=${RYOT_DB_PASS}
      - POSTGRES_DB=ryot
      - TZ=Europe/London
    volumes:
      - ../homelab-data/ryot/db:/var/lib/postgresql/data
    networks:
      - homelab_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Europe/London
      - WEBUI_PORT=${QBITTORRENT_WEBUI_PORT}
    volumes:
      - ../homelab-data/qbittorrent/config:/config
      - ../homelab-data/downloads:/downloads
    ports:
      - "${QBITTORRENT_WEBUI_PORT}:8080"
      - "${QBITTORRENT_TCP_PORT}:6881"
      - "${QBITTORRENT_UDP_PORT}:6881/udp"
    restart: unless-stopped
    networks:
      - homelab_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080" ]
      interval: 1m
      timeout: 10s
      retries: 3

networks:
  homelab_net:
    external: true
