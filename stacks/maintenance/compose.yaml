services:
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    ports:
      - "${UPTIMEKUMA_PORT}:3001"
    volumes:
      - ../../data/uptime-kuma:/app/data
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    # labels:
    #   - "com.centurylinklabs.watchtower.enable=true"
    #   # Homepage discovery (Tailscale-only access)
    #   - "homepage.group=Infrastructure"
    #   - "homepage.name=Uptime Kuma"
    #   - "homepage.icon=uptime-kuma.png"
    #   - "homepage.href=http://100.106.40.5:${UPTIMEKUMA_PORT}"
    #   - "homepage.description=HTTP/TCP uptime monitoring"
    networks:
      - homelab_net

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/localtime:/etc/localtime:ro
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      # Run at 3am daily — avoids surprise restarts during use
      - WATCHTOWER_SCHEDULE=0 0 3 * * *
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_STOPPED=false
      - WATCHTOWER_NO_STARTUP_MESSAGE=false
      # Monitor-only mode: sends notifications but does not automatically update images
      - WATCHTOWER_MONITOR_ONLY=true
      # Opt-in mode: only update containers with com.centurylinklabs.watchtower.enable=true label
      - WATCHTOWER_LABEL_ENABLE=true
      - TZ=${TZ}
      # Compatibility with Docker Engine >= 26 (min API version raised to 1.40)
      - DOCKER_API_VERSION=1.40
    restart: unless-stopped
    networks:
      - socket_internal

networks:
  homelab_net:
    external: true
  proxy_net:
    external: true
  socket_internal:
    external: true
  infrastructure_internal:
    external: true

