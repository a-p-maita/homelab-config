services:
  # Have to access on localhost:ACTUAL_BUDGET_PORT until traefik reverse proxy is set up, since it requires SharedArrayBuffer which isn't supported on a tailscale network
  actual_server:
    image: docker.io/actualbudget/actual-server:latest
    container_name: actual_server
    env_file:
      - ../../.env
    ports:
      # This line makes Actual available at port 5006 of the device you run the server on,
      # i.e. http://localhost:5006. You can change the first number to change the port, if you want.
      - "${ACTUAL_BUDGET_PORT}:5006"
    # environment:
    # Uncomment any of the lines below to set configuration options.
    # - ACTUAL_HTTPS_KEY=/data/selfhost.key
    # - ACTUAL_HTTPS_CERT=/data/selfhost.crt
    # - ACTUAL_PORT=5006
    # - ACTUAL_UPLOAD_FILE_SYNC_SIZE_LIMIT_MB=20
    # - ACTUAL_UPLOAD_SYNC_ENCRYPTED_FILE_SYNC_SIZE_LIMIT_MB=50
    # - ACTUAL_UPLOAD_FILE_SIZE_LIMIT_MB=20
    # See all options and more details at https://actualbudget.org/docs/config/
    # !! If you are not using any of these options, remove the 'environment:' tag entirely.
    volumes:
      # Change './actual-data' below to the path to the folder you want Actual to store its data in on your server.
      # '/data' is the path Actual will look for its files in by default, so leave that as-is.
      - ${DATA_ROOT}/app_data/actual-data:/data
    healthcheck:
      # Enable health check for the instance
      test: ["CMD-SHELL", "node scripts/health-check.js"]
      # health check using self signed certs
      # test: ['CMD-SHELL', 'NODE_EXTRA_CA_CERTS=/data/selfhost.crt node scripts/health-check.js']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  mealie:
    image: ghcr.io/mealie-recipes/mealie:latest
    container_name: mealie
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      # Set Backend ENV Variables Here
      ALLOW_SIGNUP: ${ALLOW_SIGNUP_STRING}
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TIMEZONE}
      BASE_URL: https://mealie.${DOMAIN}
      # BASE_URL: http://localhost:${MEALIE_PORT}
      # Start of extra ENV variables (https://docs.mealie.io/documentation/getting-started/installation/backend-config/)
    volumes:
      - ${DATA_ROOT}/app_data/mealie-data:/app/data/
      ## Defaults are false, see to work it with Authentik and there's more ENV variables to set
      # LDAP_AUTH_ENABLED: true
      # OIDC_AUTH_ENABLED: true
      #
    ports:
      # Default port is 9925
      # - "9925:9000"
      - "${MEALIE_PORT}:9000"
    deploy:
      resources:
        limits:
          memory: 1000M #

  yamtrack:
    container_name: yamtrack
    image: ghcr.io/fuzzygrim/yamtrack
    restart: unless-stopped
    env_file:
      - ../../.env
    depends_on:
      - redis
    environment:
      - TZ=${TIMEZONE}
      - SECRET=${YAMTRACK_SECRET_LONGSTRING}
      - REDIS_URL=redis://redis:6379
    volumes:
      - ${DATA_ROOT}/app_data/yamtrack:/yamtrack/db
    ports:
      - "${YAMTRACK_PORT}:8000"

  redis:
    container_name: yamtrack-redis
    image: redis:8-alpine
    restart: unless-stopped
    env_file:
      - ../../.env
    volumes:
      - ${DATA_ROOT}/app_data/redis:/data

volumes:
  redis_data:

