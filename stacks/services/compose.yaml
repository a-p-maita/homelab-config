services:
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx@sha256:6c86cad803970ea782683a8e80e7403444c5bf3cf70de63b4d3c8e87500db92f
    restart: unless-stopped
    environment:
      - PAPERLESS_ADMIN_USER=${PAPERLESS_ADMIN_USER}
      - PAPERLESS_ADMIN_PASSWORD=${PAPERLESS_ADMIN_PASS}
      - PAPERLESS_DB_PASSWORD=${PAPERLESS_DB_PASS}
    volumes:
      - ${DATA_ROOT}/paperless:/usr/src/paperless/data
    networks:
      - backend
      - proxy_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.paperless.rule=Host(`paperless.${DOMAIN}`)"
      - "traefik.http.services.paperless.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    cpus: "0.5"
    mem_limit: 512M
    mem_reservation: 128M
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  joplin:
    image: joplin/server@sha256:0877bfba41a943017c42c58e90db9d8d548bfe699b5e410248b5b879371734f9
    restart: unless-stopped
    environment:
      - DB_PASSWORD=${JOPLIN_DB_PASS}
    volumes:
      - ${DATA_ROOT}/joplin:/data
    networks:
      - backend
      - proxy_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.joplin.rule=Host(`joplin.${DOMAIN}`)"
      - "traefik.http.services.joplin.loadbalancer.server.port=22300"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:22300/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    cpus: "0.25"
    mem_limit: 256M
    mem_reservation: 64M
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M

  vaultwarden:
    image: vaultwarden/server@sha256:d626d04934cd1192ad8ced1adb975099fca78cec33ab467d2d3c923cde7f3b0c
    restart: unless-stopped
    environment:
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
    volumes:
      - ${DATA_ROOT}/vaultwarden:/data
    networks:
      - backend
      - proxy_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vaultwarden.rule=Host(`vault.${DOMAIN}`)"
      - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    cpus: "0.25"
    mem_limit: 256M
    mem_reservation: 64M
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M

networks:
  proxy_net:
    external: true
  backend:
    internal: true
