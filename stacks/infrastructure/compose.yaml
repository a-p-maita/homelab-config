  # Should work with traefik, depends on wger which isn't defined here so that might be an issue.
  nginx:
    image: nginx:stable
    depends_on:
      - wger
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf
      - /mnt/user/appdata/wger/static:/home/wger/static:ro
      - /mnt/user/appdata/wger/media:/home/wger/media:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wger.rule=Host(`wger.example.com`)"
      - "traefik.http.routers.wger.entrypoints=websecure"
      - "traefik.http.routers.wger.tls=true"
      - "traefik.http.routers.wger.tls.certresolver=letsencrypt"
      - "traefik.http.routers.wger.service=wger"
      - "traefik.http.services.wger.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik_network"
      # - "traefik.http.routers.wger.middlewares=default@file"
    healthcheck:
      test: service nginx status
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - wger_network
      - traefik_network
