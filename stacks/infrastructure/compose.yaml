services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    # labels:
    #   - "com.centurylinklabs.watchtower.enable=true"
    # --metrics enables the health/ready endpoint on port 8080
    command: tunnel --metrics 0.0.0.0:8080 run
    environment:
      - TUNNEL_TOKEN_FILE=/run/secrets/tunnel-token
    secrets:
      - tunnel-token
    ports:
      - "${CLOUDFLARED_PORT}:8080"
    networks:
      - homelab_net
      - proxy_net

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    ports:
      - "${HOMEPAGE_PORT}:3000"
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=${HOMEPAGE_ALLOWED_HOSTS}
      # ── Arr widget API keys — set these in .env after first arr stack start ──
      # Get each key from Settings → General inside the respective service UI.
      - HOMEPAGE_VAR_RADARR_API_KEY=${RADARR_API_KEY:-}
      - HOMEPAGE_VAR_SONARR_API_KEY=${SONARR_API_KEY:-}
      - HOMEPAGE_VAR_LIDARR_API_KEY=${LIDARR_API_KEY:-}
      - HOMEPAGE_VAR_PROWLARR_API_KEY=${PROWLARR_API_KEY:-}
      - HOMEPAGE_VAR_BAZARR_API_KEY=${BAZARR_API_KEY:-}
      - HOMEPAGE_VAR_AUTOBRR_API_KEY=${AUTOBRR_API_KEY:-}
      - HOMEPAGE_VAR_SEERR_API_KEY=${SEERR_API_KEY:-}
      - HOMEPAGE_VAR_JELLYFIN_API_KEY=${JELLYFIN_API_KEY:-}
      # ── qBittorrent widget credentials (same as WebUI login) ─────────────────
      - HOMEPAGE_VAR_QBT_USER=${QBITTORRENT_WEBUI_USER}
      - HOMEPAGE_VAR_QBT_PASS_FILE=/run/secrets/qbittorrent-webui-pass
    volumes:
      - ../../data/homepage/config:/app/config
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    # labels:
    #   - "com.centurylinklabs.watchtower.enable=true"
    #   # Caddy routing — protected by Authelia 2FA
    #   - "caddy=http://homepage.andreasmaita.com http://home.andreasmaita.com"
    #   - "caddy.1_import=authelia_auth"
    #   - "caddy.2_reverse_proxy=http://homepage:3000"
    #   # Homepage self-discovery
    #   - "homepage.group=Infrastructure"
    #   - "homepage.name=Homepage"
    #   - "homepage.icon=homepage.png"
    #   - "homepage.href=https://homepage.andreasmaita.com"
    #   - "homepage.description=Service dashboard"
    networks:
      - homelab_net
      - socket_internal
      - proxy_net

  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    ports:
      - "${UPTIMEKUMA_PORT}:3001"
    volumes:
      - ../../data/uptime-kuma:/app/data
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    # labels:
    #   - "com.centurylinklabs.watchtower.enable=true"
    #   # Homepage discovery (Tailscale-only access)
    #   - "homepage.group=Infrastructure"
    #   - "homepage.name=Uptime Kuma"
    #   - "homepage.icon=uptime-kuma.png"
    #   - "homepage.href=http://100.106.40.5:${UPTIMEKUMA_PORT}"
    #   - "homepage.description=HTTP/TCP uptime monitoring"
    networks:
      - homelab_net

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/localtime:/etc/localtime:ro
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      # Run at 3am daily — avoids surprise restarts during use
      - WATCHTOWER_SCHEDULE=0 0 3 * * *
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_STOPPED=false
      - WATCHTOWER_NO_STARTUP_MESSAGE=false
      # Monitor-only mode: sends notifications but does not automatically update images
      - WATCHTOWER_MONITOR_ONLY=true
      # Opt-in mode: only update containers with com.centurylinklabs.watchtower.enable=true label
      - WATCHTOWER_LABEL_ENABLE=true
      - TZ=${TZ}
      # Compatibility with Docker Engine >= 26 (min API version raised to 1.40)
      - DOCKER_API_VERSION=1.40
    restart: unless-stopped
    networks:
      - socket_internal

  caddy:
    image: lucaslorentz/caddy-docker-proxy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    labels:
      # Global Caddy config — applies to the entire server block
      caddy.auto_https: "off"
      caddy.servers.trusted_proxies: "static private_ranges"
    volumes:
      - ../../data/caddy:/data
    networks:
      - proxy_net
      - socket_internal
    depends_on:
      - docker-socket-proxy

  authelia:
    image: authelia/authelia:latest
    container_name: authelia
    restart: unless-stopped
    # labels:
    #   - example "traefik.enable=true"
    depends_on:
      authelia-redis:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      # Secrets injected at runtime — kept out of config/authelia/ (which is git-tracked)
      - AUTHELIA_SESSION_SECRET_FILE=/run/secrets/authelia-session-secret
      - AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE=/run/secrets/authelia-storage-encryption-key
      - AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE=/run/secrets/authelia-session-secret
      # Let Authelia read the SMTP password from the Docker secret file.
      # The secret is declared below as `authelia-smtp-password` and mapped to
      # /run/secrets/authelia-smtp-password by Docker Compose.
      - AUTHELIA_NOTIFIER_SMTP_PASSWORD_FILE=/run/secrets/authelia-smtp-password
    secrets:
      - authelia-session-secret
      - authelia-storage-encryption-key
      - authelia-users-db
      - authelia-smtp-password
    volumes:
      - ../../config/authelia:/config
      # Override in-repo configuration with an explicitly managed file under backups/secrets
      - ../../backups/secrets/authelia-configuration.yml:/config/configuration.yml:ro
    networks:
      - proxy_net
      - infrastructure_internal

  authelia-redis:
    image: redis:latest
    container_name: authelia-redis
    restart: unless-stopped
    volumes:
      - ../../data/authelia/redis:/data
    networks:
      - infrastructure_internal

  # ── Docker Socket Proxy ───────────────────────────────────────────────────────
  # Least-privilege Docker API proxy — exposes only the permissions needed by
  # Caddy and Homepage. Never accessible outside socket_internal.
  docker-socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy
    restart: unless-stopped
    environment:
      # Allow read-only container and network inspection for Caddy + Homepage label discovery
      - CONTAINERS=1
      - INFO=1
      - VERSION=1
      - NETWORKS=1
      - SERVICES=1
      - EVENTS=1
      - VOLUMES=0
      - IMAGES=0
      - TASKS=0
      - NODES=0
      # Hard-disable all write/auth endpoints
      - POST=0
      - AUTH=0
      - SECRETS=0
      - EXEC=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket_internal

networks:
  homelab_net:
    external: true
  proxy_net:
    external: true
  socket_internal:
    external: true
  infrastructure_internal:
    external: true

