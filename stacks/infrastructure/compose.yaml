services:
  # ── Cloudflared ─────────────────────────────────────────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:2024.5.1
    container_name: cloudflared
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # --metrics enables the health/ready endpoint on port 8080
    command: tunnel --metrics 0.0.0.0:8080 run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    ports:
      - "${CLOUDFLARED_PORT}:8080"
    networks:
      - homelab_net
      - proxy_net
    healthcheck:
      # Distroless image: no shell/curl. --version exits 0 if the binary is alive.
      # Tunnel connectivity is visible in logs; real monitoring via Uptime Kuma.
      test: ["CMD", "cloudflared", "--version"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 64M

  # ── Homepage ─────────────────────────────────────────────────────────────────
  homepage:
    image: ghcr.io/gethomepage/homepage:0.6.2
    container_name: homepage
    ports:
      - "${HOMEPAGE_PORT}:3000"
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=${HOMEPAGE_ALLOWED_HOSTS}
      # ── Arr widget API keys — set these in .env after first arr stack start ──
      # Get each key from Settings → General inside the respective service UI.
      - HOMEPAGE_VAR_RADARR_API_KEY=${RADARR_API_KEY:-}
      - HOMEPAGE_VAR_SONARR_API_KEY=${SONARR_API_KEY:-}
      - HOMEPAGE_VAR_LIDARR_API_KEY=${LIDARR_API_KEY:-}
      - HOMEPAGE_VAR_PROWLARR_API_KEY=${PROWLARR_API_KEY:-}
      - HOMEPAGE_VAR_BAZARR_API_KEY=${BAZARR_API_KEY:-}
      - HOMEPAGE_VAR_AUTOBRR_API_KEY=${AUTOBRR_API_KEY:-}
      - HOMEPAGE_VAR_SEERR_API_KEY=${SEERR_API_KEY:-}
      - HOMEPAGE_VAR_JELLYFIN_API_KEY=${JELLYFIN_API_KEY:-}
      # ── qBittorrent widget credentials (same as WebUI login) ─────────────────
      - HOMEPAGE_VAR_QBT_USER=${QBITTORRENT_WEBUI_USER}
      - HOMEPAGE_VAR_QBT_PASS=${QBITTORRENT_WEBUI_PASS}
    volumes:
      - ../../data/homepage/config:/app/config
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      # Caddy routing — protected by Authelia 2FA
      - "caddy=http://homepage.andreasmaita.com http://home.andreasmaita.com"
      - "caddy.1_import=authelia_auth"
      - "caddy.2_reverse_proxy=http://homepage:3000"
      # Homepage self-discovery
      - "homepage.group=Infrastructure"
      - "homepage.name=Homepage"
      - "homepage.icon=homepage.png"
      - "homepage.href=https://homepage.andreasmaita.com"
      - "homepage.description=Service dashboard"
    networks:
      - homelab_net
      - socket_internal
      - proxy_net
    healthcheck:
      # homepage (node:alpine) has wget (BusyBox) but not curl
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 > /dev/null"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M

  # ── Uptime Kuma ──────────────────────────────────────────────────────────────
  uptime-kuma:
    image: louislam/uptime-kuma:1.23.1
    container_name: uptime-kuma
    ports:
      - "${UPTIMEKUMA_PORT}:3001"
    volumes:
      - ../../data/uptime-kuma:/app/data
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      # Homepage discovery (Tailscale-only access)
      - "homepage.group=Infrastructure"
      - "homepage.name=Uptime Kuma"
      - "homepage.icon=uptime-kuma.png"
      - "homepage.href=http://100.106.40.5:${UPTIMEKUMA_PORT}"
      - "homepage.description=HTTP/TCP uptime monitoring"
    networks:
      - homelab_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 128M

  # ── Watchtower ───────────────────────────────────────────────────────────────
  watchtower:
    image: containrrr/watchtower:1.9.2
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/localtime:/etc/localtime:ro
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      # Run at 3am daily — avoids surprise restarts during use
      - WATCHTOWER_SCHEDULE=0 0 3 * * *
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_STOPPED=false
      - WATCHTOWER_NO_STARTUP_MESSAGE=false
      # Monitor-only mode: sends notifications but does not automatically update images
      - WATCHTOWER_MONITOR_ONLY=true
      # Opt-in mode: only update containers with com.centurylinklabs.watchtower.enable=true label
      - WATCHTOWER_LABEL_ENABLE=true
      - TZ=${TZ}
      # Compatibility with Docker Engine >= 26 (min API version raised to 1.40)
      - DOCKER_API_VERSION=1.40
    restart: unless-stopped
    networks:
      - socket_internal
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M

  # ── Caddy (caddy-docker-proxy) ────────────────────────────────────────────────
  # Label-driven HTTP reverse proxy. Reads caddy.* labels from all containers.
  # cloudflared → http://caddy:80 → services (plain HTTP on proxy_net).
  # Uses docker-socket-proxy (socket_internal) to enumerate container labels safely.
  # In non-Swarm Docker, Caddy may still log non-fatal 403s while checking ingress/swarm resources.
  caddy:
    image: lucaslorentz/caddy-docker-proxy:ci-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    labels:
      # Global Caddy config — applies to the entire server block
      caddy.auto_https: "off"
      caddy.servers.trusted_proxies: "static private_ranges"
    volumes:
      - ../../data/caddy:/data
    networks:
      - proxy_net
      - socket_internal
    depends_on:
      - docker-socket-proxy
    healthcheck:
      # Admin API on :2019 responds once Caddy is running and config is loaded
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:2019/config/ > /dev/null || exit 1",
        ]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  # ── Authelia ─────────────────────────────────────────────────────────────────
  #   STOP: Caddy must be running first. Requires config/authelia/ files.
  # See homelab-plan.md Phase 11 for setup instructions.
  #
  authelia:
    image: authelia/authelia:5.13.0
    container_name: authelia
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      # Forward-auth snippet — referenced by caddy.1_import=authelia_auth on protected services
      - "caddy_0=(authelia_auth)"
      - "caddy_0.forward_auth=authelia:9091"
      - "caddy_0.forward_auth.uri=/api/verify"
      - "caddy_0.forward_auth.copy_headers=Remote-User Remote-Groups Remote-Email Remote-Name"
      - "caddy_0.forward_auth.header_up=X-Forwarded-Proto https"
      - "caddy_0.forward_auth.header_up=X-Forwarded-Host {http.request.host}"
      - "caddy_0.forward_auth.header_up=X-Forwarded-Uri {http.request.uri}"
      # Authelia own public domain
      - "caddy_1=http://auth.andreasmaita.com"
      - "caddy_1.reverse_proxy=http://authelia:9091"
      # Homepage discovery
      - "homepage.group=Infrastructure"
      - "homepage.name=Authelia"
      - "homepage.icon=authelia.png"
      - "homepage.href=https://auth.andreasmaita.com"
      - "homepage.description=2FA authentication portal"
    depends_on:
      authelia-redis:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      # Secrets injected at runtime — kept out of config/authelia/ (which is git-tracked)
      - AUTHELIA_SESSION_SECRET=${AUTHELIA_SESSION_SECRET}
      - AUTHELIA_STORAGE_ENCRYPTION_KEY=${AUTHELIA_STORAGE_ENCRYPTION_KEY}
      - AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET=${AUTHELIA_SESSION_SECRET}
    volumes:
      - ../../config/authelia:/config
    networks:
      - proxy_net
      - infrastructure_internal

  authelia-redis:
    image: redis:7.2-alpine
    container_name: authelia-redis
    restart: unless-stopped
    volumes:
      - ../../data/authelia/redis:/data
    networks:
      - infrastructure_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
  #  # NOTE: do NOT add watchtower label to redis

  # ── Docker Socket Proxy ───────────────────────────────────────────────────────
  # Least-privilege Docker API proxy — exposes only the permissions needed by
  # Caddy and Homepage. Never accessible outside socket_internal.
  docker-socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:1.7.0
    container_name: docker-socket-proxy
    restart: unless-stopped
    environment:
      # Allow read-only container and network inspection for Caddy + Homepage label discovery
      - CONTAINERS=1
      - INFO=1
      - VERSION=1
      - NETWORKS=1
      - SERVICES=1
      - EVENTS=1
      - VOLUMES=0
      - IMAGES=0
      - TASKS=0
      - NODES=0
      # Hard-disable all write/auth endpoints
      - POST=0
      - AUTH=0
      - SECRETS=0
      - EXEC=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket_internal
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          cpus: "0.05"
          memory: 16M

networks:
  homelab_net:
    external: true
  proxy_net:
    external: true
  socket_internal:
    external: true
  infrastructure_internal:
    external: true
