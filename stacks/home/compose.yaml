name: home

# ─────────────────────────────────────────────────────────────────────────────
# Home stack: Home Assistant
#
# Service statuses:
#   home-assistant →   STOP: First-time onboarding wizard required in browser.
#                    Open http://localhost:${HOME_ASSISTANT_PORT} and complete
#                    the wizard to create your admin account, set location,
#                    and configure integrations.
#
# Network note: Home Assistant works best with host network mode for device
# discovery (mDNS, Bluetooth, Zigbee USB). If you need device discovery,
# change network_mode to "host" and remove the ports mapping (HA will use
# port 8123 directly on the host).
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Home Assistant ──────────────────────────────────────────────────────────
  #   STOP: First-time setup wizard required in browser.
  # Visit http://localhost:${HOME_ASSISTANT_PORT} and create your admin account.
  #
  # Note for device discovery (Zigbee, Z-Wave, mDNS, Bluetooth):
  # Replace the network section below with: network_mode: "host"
  # and remove the ports mapping.
  home-assistant:
    image: homeassistant/home-assistant:stable
    container_name: home-assistant
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "${HOME_ASSISTANT_PORT}:8123"
    environment:
      - TZ=${TZ}
    volumes:
      - ../../data/home-assistant:/config
      - /etc/localtime:/etc/localtime:ro
      # Uncomment to pass through USB devices (Zigbee sticks etc.):
      # - /dev/ttyUSB0:/dev/ttyUSB0
    networks:
      - homelab_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

networks:
  homelab_net:
    external: true
