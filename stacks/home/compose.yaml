services:
  homeassistant:
    image: homeassistant/home-assistant@sha256:ceb1202133a5a036e8b03e20a10eb113186cc2f871968323c6fc6c3fc4205716
    restart: unless-stopped
    volumes:
      - ${DATA_ROOT}/homeassistant:/config
    network_mode: host
    environment:
      - TZ=${TZ}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8123/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    cpus: "1.0"
    mem_limit: 1024M
    mem_reservation: 256M
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.2"
          memory: 256M
