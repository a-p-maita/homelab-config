services:
  homeassistant:
    image: homeassistant/home-assistant:latest
    restart: unless-stopped
    volumes:
      - ${DATA_ROOT}/homeassistant:/config
    network_mode: host
    environment:
      - TZ=${TZ}

  postgres-nextcloud:
    image: postgres:latest
    restart: unless-stopped
    environment:
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD_FILE=/run/secrets/nextcloud-db-password
      - POSTGRES_DB=nextcloud
    secrets:
      - nextcloud-db-password
    volumes:
      - ${DATA_ROOT}/postgres/nextcloud:/var/lib/postgresql/data
    networks:
      - backend

  nextcloud:
    image: nextcloud:latest
    restart: unless-stopped
    environment:
      - MYSQL_PASSWORD_FILE=/run/secrets/nextcloud-db-password
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
    volumes:
      - ${DATA_ROOT}/nextcloud:/var/www/html
    networks:
      - proxy_net
      - backend

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    restart: unless-stopped
    environment:
      - PAPERLESS_ADMIN_USER=${PAPERLESS_ADMIN_USER}
      - PAPERLESS_ADMIN_PASSWORD_FILE=/run/secrets/paperless-admin-pass
      - PAPERLESS_DB_PASSWORD_FILE=/run/secrets/paperless-db-pass
    volumes:
      - ${DATA_ROOT}/paperless:/usr/src/paperless/data
    networks:
      - backend
      - proxy_net

networks:
  proxy_net:
    external: true
  backend:
    internal: true

