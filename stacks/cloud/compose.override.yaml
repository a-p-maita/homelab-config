services:
  immich-server:
    container_name: immich-server
    # Port: keep upstream default 2283:2283 — do NOT override.
    # Immich mobile clients connect via Tailscale to 100.106.40.5:2283 and cannot be
    # easily reconfigured. The upstream compose.yaml already publishes 2283:2283.
    # NEVER add watchtower label — update manually by bumping IMMICH_VERSION in .env
    # then: docker compose pull && docker compose up -d
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      DB_USERNAME: ${DB_USERNAME}
      DB_DATABASE_NAME: ${DB_DATABASE_NAME}
      IMMICH_VERSION: ${IMMICH_VERSION}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "caddy=http://immich.andreasmaita.com"
      - "caddy.2_reverse_proxy=http://immich-server:2283"
      - "homepage.group=Cloud"
      - "homepage.name=Immich"
      - "homepage.icon=immich.png"
      - "homepage.href=https://immich.andreasmaita.com"
      - "homepage.description=Photo and video library"
    networks:
      - homelab_net
      - proxy_net
      - immich_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2283/api/server/ping"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  nextcloud:
    container_name: nextcloud
    image: nextcloud:stable-apache
    environment:
      - POSTGRES_HOST=nextcloud-postgres
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD=${NEXTCLOUD_DB_PASSWORD}
      - REDIS_HOST=nextcloud-redis
      - REDIS_HOST_PASSWORD=${NEXTCLOUD_REDIS_PASSWORD}
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      - OVERWRITEPROTOCOL=https
      - OVERWRITEHOST=nextcloud.andreasmaita.com
      - OVERWRITECLIURL=https://nextcloud.andreasmaita.com
      - NEXTCLOUD_TRUSTED_DOMAINS=nextcloud.andreasmaita.com 100.106.40.5
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "caddy=http://nextcloud.andreasmaita.com"
      - "caddy.1_import=authelia_auth"
      - "caddy.2_reverse_proxy=http://nextcloud:80"
      - "homepage.group=Cloud"
      - "homepage.name=Nextcloud"
      - "homepage.icon=nextcloud.png"
      - "homepage.href=https://nextcloud.andreasmaita.com"
      - "homepage.description=Cloud storage and collaboration"
    networks:
      - homelab_net
      - proxy_net
      - cloud_internal
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 1m
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  immich-machine-learning:
    container_name: immich-machine-learning
    # AMD Vega 7 iGPU has no ROCm support — ML too slow on CPU; disabled
    profiles: [disabled]
    environment:
      IMMICH_VERSION: ${IMMICH_VERSION}
    networks:
      - homelab_net
      - immich_internal
    healthcheck:
      # image has no curl; use Python (available at /opt/venv/bin/python3)
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:3003/ping')",
        ]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

networks:
  homelab_net:
    external: true
  cloud_internal:
    internal: true
