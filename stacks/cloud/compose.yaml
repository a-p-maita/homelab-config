services:
  postgres-nextcloud:
    image: postgres@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    restart: unless-stopped
    environment:
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD_FILE=/run/secrets/nextcloud-db-password
      - POSTGRES_DB=nextcloud
    secrets:
      - nextcloud-db-password
    volumes:
      - ${DATA_ROOT}/postgres/nextcloud:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    cpus: "0.5"
    mem_limit: 512M
    mem_reservation: 128M
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  nextcloud:
    image: nextcloud@sha256:92da6b0a45c52903fc4a4eed2e7274fd89ff3ef05f501299d9df810c804cc59b
    restart: unless-stopped
    environment:
      - MYSQL_PASSWORD_FILE=/run/secrets/nextcloud-db-password
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
    volumes:
      - ${DATA_ROOT}/nextcloud:/var/www/html
    networks:
      - proxy_net
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nextcloud.rule=Host(`nextcloud.${DOMAIN}`)"
      - "traefik.http.services.nextcloud.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/status.php || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    cpus: "1.0"
    mem_limit: 1024M
    mem_reservation: 256M
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.2"
          memory: 256M

networks:
  proxy_net:
    external: true
  backend:
    internal: true

secrets:
  nextcloud-db-password:
    file: ../../backups/secrets/nextcloud-db-password.secret
