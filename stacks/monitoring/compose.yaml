name: monitoring

# ─────────────────────────────────────────────────────────────────────────────
# Monitoring stack: Dockge stack manager
#
# Dockge is bound to the Tailscale interface only (100.106.40.5:20202).
# It gets raw socket access because it manages compose stacks.
# Access: http://100.106.40.5:20202
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Dockge ───────────────────────────────────────────────────────────────────
  # Stack manager — replaces up-all.sh / down-all.sh.
  # Tailscale-only: bound to 100.106.40.5 so it is NOT reachable from the internet.
  dockge:
    image: louislam/dockge:1
    container_name: dockge
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../data/dockge:/app/data
      - ../../stacks:/opt/stacks
    environment:
      - DOCKGE_STACKS_DIR=/opt/stacks
    ports:
      # Bound to Tailscale IP — never exposed to the public internet
      - "100.106.40.5:20202:5001"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M
