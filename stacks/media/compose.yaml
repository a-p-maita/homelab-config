services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    # ABS runs on port 13378 by default. If you want to change
    # the port, only change the external port, not the internal port
    env_file:
      # - specific.env
      - ../../.env
    environment:
      # - AUDIOBOOKSHELF_PORT=/run/secrets/audiobookshelf-port
      # - AUDIOBOOKSHELF_PORT=${AUDIOBOOKSHELF_PORT}
      # - DATA_ROOT=${DATA_ROOT}
      - AUDIOBOOKSHELF_PORT=${AUDIOBOOKSHELF_PORT}
      - DATA_ROOT=${DATA_ROOT}
    ports:
      # - 13378:${AUDIOBOOKSHELF_PORT}
      - ${AUDIOBOOKSHELF_PORT}:80
      # - 13378:80
    volumes:
      # These volumes are needed to keep your library persistent
      # and allow media to be accessed by the ABS server.
      # The path to the left of the colon is the path on your computer,
      # and the path to the right of the colon is where the data is
      # available to ABS in Docker.
      # You can change these media directories or add as many as you want
      - $DATA_ROOT/media/audiobooks:/audiobooks
      - $DATA_ROOT/media/podcasts:/podcasts
      # The metadata directory can be stored anywhere on your computer
      - $DATA_ROOT/app_data/audiobookshelf/metadata:/metadata
      # The config directory needs to be on the same physical machine
      # you are running ABS on
      - $DATA_ROOT/app_data/audiobookshelf/config:/config
    restart: unless-stopped
    # You can use the following user directive to run the ABS
    # docker container as a specific user. You will need to change
    # the UID and GID to the correct values for your user.
    # user: 1000:1000
    # networks:
    #   - proxy_net
    #   - backend
  # navidrome:
  #   image: deluan/navidrome:latest
  #   restart: unless-stopped
  #   environment:
  #     - ND_USERNAME=${NAVIDROME_USER}
  #     - ND_PASSWORD_FILE=/run/secrets/navidrome-pass
  #   volumes:
  #     - ${DATA_ROOT}/music:/music
  #     - ${DATA_ROOT}/navidrome_db:/data
  #   networks:
  #     - proxy_net
  #     - backend

  # jellyfin:
  #   image: jellyfin/jellyfin
  #   container_name: jellyfin
  #   # Optional - specify the uid and gid you would like Jellyfin to use instead of root
  #   user: uid:gid
  #   ports:
  #     - 8096:8096/tcp
  #     - 7359:7359/udp
  #   volumes:
  #     - /path/to/config:/config
  #     - /path/to/cache:/cache
  #     - type: bind
  #       source: /path/to/media
  #       target: /media
  #     - type: bind
  #       source: /path/to/media2
  #       target: /media2
  #       read_only: true
  #     # Optional - extra fonts to be used during transcoding with subtitle burn-in
  #     - type: bind
  #       source: /path/to/fonts
  #       target: /usr/local/share/fonts/custom
  #       read_only: true
  #   restart: 'unless-stopped'
  #   # Optional - alternative address used for autodiscovery
  #   environment:
  #     - JELLYFIN_PublishedServerUrl=http://example.com
  #   # Optional - may be necessary for docker healthcheck to pass if running in host network mode
  #   extra_hosts:
  #     - 'host.docker.internal:host-gateway'
  #   networks:
  #     - proxy_net
  #     - backend

networks:
  proxy_net:
    external: true
  backend:
    internal: true

secrets:
  #   navidrome-pass:
  #     file: secrets/navidrome-pass.secret#
  audiobookshelf-port:
    file: secrets/audiobookshelf-port.txt
  data-root:
    file: ../../secrets/data-root.secret
