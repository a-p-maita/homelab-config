name: media

# ─────────────────────────────────────────────────────────────────────────────
# Media stack: audiobooks, podcasts, music, media tracking
#
# Services moved to stacks/arr/compose.yaml:
#   qbittorrent, jackett, audiobookbay-downloader, lidarr
# ─────────────────────────────────────────────────────────────────────────────

services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    environment:
      - PUID=${PUID} # ensures container writes podcast episodes as the host user
      - PGID=${PGID} # fixes podcast download persistence (write access to /podcasts)
      - TZ=${TZ}
    ports:
      - "${ABS_PORT}:80"
    volumes:
      - ../../data/audiobookshelf/config:/config
      - ../../data/audiobookshelf/metadata:/metadata
      - ${DATA_ROOT}/media/audiobooks:/audiobooks
      - ${DATA_ROOT}/media/podcasts:/podcasts
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "caddy=http://audiobookshelf.andreasmaita.com"
      - "caddy.1_import=authelia_auth"
      - "caddy.2_reverse_proxy={{upstreams 80}}"
      - "homepage.group=Media"
      - "homepage.name=AudioBookshelf"
      - "homepage.icon=audiobookshelf.png"
      - "homepage.href=https://audiobookshelf.andreasmaita.com"
      - "homepage.description=Audio book library"
    networks:
      - homelab_net
      - proxy_net
    healthcheck:
      # node:alpine has no curl — use BusyBox wget
      test: ["CMD-SHELL", "wget -qO- http://localhost:80 > /dev/null"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  yamtrack:
    image: ghcr.io/fuzzygrim/yamtrack
    container_name: yamtrack
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "caddy=http://yamtrack.andreasmaita.com"
      - "caddy.1_import=authelia_auth"
      - "caddy.2_reverse_proxy={{upstreams 8000}}"
      - "homepage.group=Media"
      - "homepage.name=Yamtrack"
      - "homepage.icon=yamtrack.png"
      - "homepage.href=https://yamtrack.andreasmaita.com"
      - "homepage.description=Media tracking sync"
    #  First run: visit http://localhost:${YAMTRACK_PORT}/register to create your admin account,
    #    then set REGISTRATION=False below and run: docker compose restart yamtrack
    depends_on:
      yamtrack-redis:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - SECRET=${YAMTRACK_SECRET}
      - REDIS_URL=redis://yamtrack-redis:6379
      # URLS: comma-separated trusted origins (sets CSRF + ALLOWED_HOSTS)
      - URLS=${YAMTRACK_EXTERNAL_URL}
      - IGDB_ID=${IGDB_CLIENT_ID}
      - IGDB_SECRET=${IGDB_CLIENT_SECRET}
      # TMDB_API: optional v3 API key — a default is built-in if left blank
      - TMDB_API=${YAMTRACK_TMDB_API:-}
      # Trakt OAuth — register app at https://trakt.tv/oauth/applications
      # Redirect URI to register: https://yamtrack.andreasmaita.com/import/trakt/private
      - TRAKT_API=${YAMTRACK_TRAKT_CLIENT_ID:-}
      - TRAKT_API_SECRET=${YAMTRACK_TRAKT_CLIENT_SECRET:-}
      # AniList OAuth — register app at https://anilist.co/settings/developer
      # Redirect URI to register: https://yamtrack.andreasmaita.com/import/anilist/private
      - ANILIST_ID=${YAMTRACK_ANILIST_CLIENT_ID:-}
      - ANILIST_SECRET=${YAMTRACK_ANILIST_CLIENT_SECRET:-}
      # Set YAMTRACK_REGISTRATION=False in .env after creating your admin account,
      # then restart: docker compose -f dockerfiles/media/compose.yaml restart yamtrack
      - REGISTRATION=${YAMTRACK_REGISTRATION:-True}
      - STEAM_API_KEY=${STEAM_API_KEY:-}
    volumes:
      - ../../data/yamtrack:/yamtrack/db
    ports:
      - "${YAMTRACK_PORT}:8000"
    networks:
      - homelab_net
      - proxy_net
      - media_internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python3 -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000'')"',
        ]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 256M

  yamtrack-redis:
    image: redis:8-alpine
    container_name: yamtrack-redis
    restart: unless-stopped
    volumes:
      - ../../data/yamtrack/redis:/data
    networks:
      - media_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M

  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    user: "${PUID}:${PGID}"
    environment:
      - ND_SCANSCHEDULE=1h
      - ND_LOGLEVEL=info
      # Extend session lifetime so Feishin stays logged in
      - ND_SESSIONTIMEOUT=72h
      - ND_BASEURL=
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "caddy=http://navidrome.andreasmaita.com"
      - "caddy.1_import=authelia_auth"
      - "caddy.2_reverse_proxy={{upstreams 4533}}"
      - "homepage.group=Media"
      - "homepage.name=Navidrome"
      - "homepage.icon=navidrome.png"
      - "homepage.href=https://navidrome.andreasmaita.com"
      - "homepage.description=Music server"
    volumes:
      - ../../data/navidrome/data:/data
      - ${DATA_ROOT}/media/music:/music:ro
    ports:
      - "${NAVIDROME_PORT}:4533"
    restart: unless-stopped
    networks:
      - homelab_net
      - proxy_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4533/ping > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M

  feishin:
    image: ghcr.io/jeffvli/feishin:latest
    container_name: feishin
    environment:
      - SERVER_NAME=Homelab
      - SERVER_TYPE=navidrome
      # Public URL — browser connects directly to Navidrome from client side
      - SERVER_URL=https://navidrome.andreasmaita.com
      - SERVER_LOCK=true
      - ANALYTICS_DISABLED=true
    ports:
      - "${FEISHIN_PORT}:9180"
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "caddy=http://feishin.andreasmaita.com"
      - "caddy.1_import=authelia_auth"
      - "caddy.2_reverse_proxy={{upstreams 9180}}"
      - "homepage.group=Media"
      - "homepage.name=Feishin"
      - "homepage.icon=feishin.png"
      - "homepage.href=https://feishin.andreasmaita.com"
      - "homepage.description=Navidrome companion client"
    networks:
      - homelab_net
      - proxy_net
    depends_on:
      navidrome:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9180 > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M

  crosswatch:
    image: ghcr.io/cenodude/crosswatch:latest
    container_name: crosswatch
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    #  All provider accounts (Trakt, AniList, Jellyfin, Plex, Simkl, etc.)
    #    are configured entirely through the web UI — no env vars needed.
    ports:
      - "${CROSSWATCH_PORT}:8787"
    environment:
      - TZ=${TZ}
    volumes:
      - ../../data/crosswatch:/config
    networks:
      - homelab_net
    healthcheck:
      # crosswatch image has curl but not wget; -L follows the login redirect
      test:
        ["CMD-SHELL", "curl -fsL http://localhost:8787/ -o /dev/null || exit 1"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M

  # ── Komga ────────────────────────────────────────────────────────────────────
  # Comics and manga server — browser-based reader with OPDS support.
  # Scans books from /data/books and comics from /data/comics.
  #   FIRST RUN: Create admin account at http://localhost:${KOMGA_PORT} (wizard
  #     on first visit), then add your library paths.
  komga:
    image: gotson/komga:latest
    container_name: komga
    user: "${PUID}:${PGID}"
    environment:
      - TZ=${TZ}
    volumes:
      - ../../data/komga/config:/config
      - ${DATA_ROOT}/media/books:/data/books
      - ${DATA_ROOT}/media/comics:/data/comics
    ports:
      - "${KOMGA_PORT}:25600"
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "caddy=http://komga.andreasmaita.com"
      - "caddy.1_import=authelia_auth"
      - "caddy.2_reverse_proxy={{upstreams 25600}}"
      - "homepage.group=Media"
      - "homepage.name=Komga"
      - "homepage.icon=komga.png"
      - "homepage.href=https://komga.andreasmaita.com"
      - "homepage.description=Comics and manga server"
    networks:
      - homelab_net
      - proxy_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:25600/actuator/health"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  # ── Calibre-Web ──────────────────────────────────────────────────────────────
  # Ebook library manager and reader with OPDS server + send-to-Kindle support.
  #   FIRST RUN: Open http://localhost:${CALIBREWEB_PORT} — default admin:
  #     admin / admin123 (change immediately). Set library path to /books.
  calibre-web:
    image: lscr.io/linuxserver/calibre-web:latest
    container_name: calibre-web
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - DOCKER_MODS=linuxserver/mods:universal-calibre
    volumes:
      - ../../data/calibre-web/config:/config
      - ${DATA_ROOT}/media/books:/books
    ports:
      - "${CALIBREWEB_PORT}:8083"
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "caddy=http://calibre-web.andreasmaita.com"
      - "caddy.1_import=authelia_auth"
      - "caddy.2_reverse_proxy={{upstreams 8083}}"
      - "homepage.group=Media"
      - "homepage.name=Calibre Web"
      - "homepage.icon=calibre-web.png"
      - "homepage.href=https://calibre-web.andreasmaita.com"
      - "homepage.description=Ebook library manager"
    networks:
      - homelab_net
      - proxy_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  # ── Jellyfin ────────────────────────────────────────────────────────────────
  #   STOP: First-time setup wizard in browser on first visit.
  # Create admin account and add media libraries through the wizard.
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "caddy=http://jellyfin.andreasmaita.com"
      - "caddy.1_import=authelia_auth"
      - "caddy.2_reverse_proxy={{upstreams 8096}}"
      - "homepage.group=Media"
      - "homepage.name=Jellyfin"
      - "homepage.icon=jellyfin.png"
      - "homepage.href=https://jellyfin.andreasmaita.com"
      - "homepage.description=Media streaming server"
    ports:
      - "${JELLYFIN_PORT}:8096"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    # VA-API hardware transcoding — AMD Vega 7 iGPU
    # In Jellyfin: Playback → Hardware Acceleration → VA-API → /dev/dri/renderD128
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    volumes:
      - ../../data/jellyfin/config:/config
      - ../../data/jellyfin/cache:/cache
      - ${DATA_ROOT}/media/movies:/data/movies:ro
      - ${DATA_ROOT}/media/tv:/data/tv:ro
      - ${DATA_ROOT}/media/music:/data/music:ro
      - ${DATA_ROOT}/media/audiobooks:/data/audiobooks:ro
      - ${DATA_ROOT}/media/podcasts:/data/podcasts:ro
      - ${DATA_ROOT}/media/books:/data/books:ro
      - ${DATA_ROOT}/media/youtube:/data/youtube:ro
    networks:
      - homelab_net
      - proxy_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  # ── Seerr ────────────────────────────────────────────────────────────────────
  # Media request manager — routes requests to Radarr/Sonarr.
  #   FIRST RUN: http://localhost:${SEERR_PORT} → setup wizard:
  #   1. Media server: Jellyfin → URL http://jellyfin:8096, admin creds
  #   2. Settings → Radarr → Add (host=radarr, port=7878, API key from Radarr UI)
  #   3. Settings → Sonarr → Add (host=sonarr, port=8989, API key from Sonarr UI)
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=info
    volumes:
      - ../../data/seerr/config:/app/config
    ports:
      - "${SEERR_PORT}:5055"
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "caddy=http://seerr.andreasmaita.com"
      - "caddy.1_import=authelia_auth"
      - "caddy.2_reverse_proxy={{upstreams 5055}}"
      - "homepage.group=Media"
      - "homepage.name=Seerr"
      - "homepage.icon=seerr.png"
      - "homepage.href=https://seerr.andreasmaita.com"
      - "homepage.description=Media request manager"
    networks:
      - homelab_net
      - proxy_net
    depends_on:
      jellyfin:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1",
        ]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  # ── Maintainerr ─────────────────────────────────────────────────────────────
  # Manages and auto-removes media from Jellyfin based on configurable rules.
  #   FIRST RUN: Configure at http://localhost:${MAINTAINERR_PORT} — add
  #     Jellyfin, Radarr, Sonarr connections. Create collections + rules.
  maintainerr:
    image: ghcr.io/jorenn92/maintainerr:latest
    container_name: maintainerr
    user: "${PUID}:${PGID}"
    environment:
      - TZ=${TZ}
    volumes:
      - ../../data/maintainerr:/opt/data
    ports:
      - "${MAINTAINERR_PORT}:6246"
    restart: unless-stopped
    networks:
      - homelab_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6246"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

networks:
  homelab_net:
    external: true
  proxy_net:
    external: true
  media_internal:
    internal: true
