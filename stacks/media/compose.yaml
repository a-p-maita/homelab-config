services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - WEBUI_PORT=${QBITTORRENT_WEBUI_PORT}
    restart: unless-stopped
    volumes:
      - ${DATA_ROOT}/qbit:/config
      - ${DATA_ROOT}/downloads:/downloads
    ports:
      - "${QBITTORRENT_WEBUI_PORT}:8080"
    networks:
      - proxy_net
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qbittorrent.rule=Host(`qbit.${DOMAIN}`)"
      - "traefik.http.services.qbittorrent.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M

  navidrome:
    image: deluan/navidrome:latest
    restart: unless-stopped
    environment:
      - ND_USERNAME=${NAVIDROME_USER}
      - ND_PASSWORD=${NAVIDROME_PASS}
    volumes:
      - ${DATA_ROOT}/music:/music
      - ${DATA_ROOT}/navidrome_db:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.navidrome.rule=Host(`music.${DOMAIN}`)"
      - "traefik.http.services.navidrome.loadbalancer.server.port=4533"
    networks:
      - proxy_net
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4533/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 192M
        reservations:
          cpus: "0.05"
          memory: 64M

  yamtrack:
    image: ghcr.io/fuzzygrim/yamtrack:latest
    restart: unless-stopped
    environment:
      - YAMTRACK_EXTERNAL_URL=${YAMTRACK_EXTERNAL_URL}
    volumes:
      - ${DATA_ROOT}/yamtrack:/data
    networks:
      - proxy_net
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 192M
        reservations:
          cpus: "0.05"
          memory: 64M

networks:
  proxy_net:
    external: true
  backend:
    internal: true
