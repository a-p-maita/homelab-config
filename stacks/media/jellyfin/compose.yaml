services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London
      - JELLYFIN_PublishedServerUrl=http://192.168.0.5 #optional
    volumes:
      - ${DATA_DIR}/app_data/jellyfin/config:/config
      - ${DATA_DIR}/media/tv:/data/tvshows
      - ${DATA_DIR}/media/movies:/data/movies
      - ${DATA_DIR}/media/music:/data/music
      - ${DATA_DIR}/media/books:/data/books
      - ${DATA_DIR}/media/audiobooks:/data/audiobooks

    ports:
      - 8096:8096
      - 8920:8920 #optional
      - 7359:7359/udp #optional
      - 1900:1900/udp #optional
    restart: unless-stopped
