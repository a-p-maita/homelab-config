services:
  shelfmark:
    image: ghcr.io/calibrain/shelfmark:latest
    container_name: shelfmark
    environment:
      PUID: 1000
      PGID: 1000
    ports:
      - 8084:8084
    restart: unless-stopped
    volumes:
      - ${DATA_DIR}/media/books:/books # Default destination for book downloads
      - ${DATA_DIR}/app_data/shelfmark/config:/config # App configuration
      # Required for torrent / usenet - path must match your download client's volume exactly
      - ${DATA_DIR}/downloads:/downloads
