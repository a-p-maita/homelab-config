name: arr

# ─────────────────────────────────────────────────────────────────────────────
# Arr stack: download automation (*arr apps + download clients + indexers)
#
#   TAILSCALE / LOCAL ACCESS ONLY — do NOT add these to the Cloudflare tunnel.
#
# Service startup order:
#   qbittorrent → (base)
#   jackett     → (base)
#   prowlarr    → (base)
#   byparr      → (base — Cloudflare bypass for protected indexers)
#   radarr      → depends_on: qbittorrent (healthy)
#   sonarr      → depends_on: qbittorrent (healthy)
#   lidarr      → depends_on: qbittorrent (healthy)
#   lazylibrarian → depends_on: qbittorrent (healthy)
#
# VPN (optional): bring up with compose.vpn.yaml overlay:
#   USE_VPN=true in .env  → scripts/up-all.sh handles automatically
#   Manual: docker compose -f dockerfiles/arr/compose.yaml -f dockerfiles/arr/compose.vpn.yaml up -d
#
# Paths: all *arr apps and qbittorrent mount ${DATA_ROOT}:/data
#   qBittorrent categories → /data/torrents/{movies,tv,music,books}
#   *arr root folders      → /data/media/{movies,tv,music,books}
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── qBittorrent ─────────────────────────────────────────────────────────────
  #   FIRST RUN STEPS (see FIRST-RUN.md):
  #   1. Enable "Bypass authentication for clients on localhost" (required for VPN port-sync)
  #   2. Default save path → /data/torrents (pre-seeded via up-all.sh)
  #   3. Categories pre-seeded from config-templates/qbittorrent/categories.json
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=${QBITTORRENT_WEBUI_PORT}
      - TORRENTING_PORT=${QBITTORRENT_TCP_PORT}
      - WEBUI_ADDRESS=0.0.0.0
      - WEBUI_USERNAME=${QBITTORRENT_WEBUI_USER}
      - WEBUI_PASSWORD=${QBITTORRENT_WEBUI_PASS}
    volumes:
      - ../../data/qbittorrent/config:/config
      - ${DATA_ROOT}:/data
    ports:
      - "${QBITTORRENT_WEBUI_PORT}:${QBITTORRENT_WEBUI_PORT}"
      - "${QBITTORRENT_TCP_PORT}:${QBITTORRENT_TCP_PORT}"
      - "${QBITTORRENT_UDP_PORT}:${QBITTORRENT_UDP_PORT}/udp"
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - homelab_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${QBITTORRENT_WEBUI_PORT}"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  # ── Jackett ─────────────────────────────────────────────────────────────────
  # Prowlarr handles indexers for all *arr apps.
  # Jackett kept for legacy indexer configs; Prowlarr is preferred going forward.
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - AUTO_UPDATE=true
    volumes:
      - ../../data/jackett/config:/config
      - ../../data/jackett/downloads:/downloads
    ports:
      - "${JACKETT_PORT}:9117"
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - homelab_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9117"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 128M

  # ── Prowlarr ─────────────────────────────────────────────────────────────────
  # Indexer manager. Add indexers here; Prowlarr syncs them to Radarr/Sonarr/Lidarr/Readarr.
  # First run: Settings → Apps → Add each *arr app.
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ../../data/prowlarr/config:/config
    ports:
      - "${PROWLARR_PORT}:9696"
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - homelab_net
      - arr_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9696/ping"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 128M

  # ── Radarr ───────────────────────────────────────────────────────────────────
  # Movies: root folder /data/media/movies, download client path /data/torrents/movies
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ../../data/radarr/config:/config
      - ${DATA_ROOT}:/data
    ports:
      - "${RADARR_PORT}:7878"
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - homelab_net
      - arr_internal
    depends_on:
      qbittorrent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/ping"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  # ── Sonarr ───────────────────────────────────────────────────────────────────
  # TV shows: root folder /data/media/tv, download client path /data/torrents/tv
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ../../data/sonarr/config:/config
      - ${DATA_ROOT}:/data
    ports:
      - "${SONARR_PORT}:8989"
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - homelab_net
      - arr_internal
    depends_on:
      qbittorrent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/ping"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  # ── Lidarr ───────────────────────────────────────────────────────────────────
  # Music: root folder /data/media/music, download client path /data/torrents/music
  #   FIRST RUN: update root folder in Lidarr UI from /music → /data/media/music
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      # Used by /config/custom-scripts/scan-navidrome.sh to trigger Navidrome rescan on import
      - NAVIDROME_USER=${NAVIDROME_USER:-}
      - NAVIDROME_PASS=${NAVIDROME_PASS:-}
    volumes:
      - ../../data/lidarr/config:/config
      - ${DATA_ROOT}:/data
    ports:
      - "${LIDARR_PORT}:8686"
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - homelab_net
      - arr_internal
    depends_on:
      qbittorrent:
        condition: service_healthy
    # Note: Lidarr uses Prowlarr for indexers in this setup (not Jackett directly)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8686/ping"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  # ── Byparr ───────────────────────────────────────────────────────────────────
  # FlareSolverr-compatible Cloudflare anti-bot bypass (successor to FlareSolverr).
  # Used by Prowlarr to access Cloudflare-protected indexers.
  # Configure in Prowlarr: Settings → Indexers → FlareSolverr → http://byparr:8191
  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: byparr
    init: true # required by Byparr: prevents zombie processes from Camoufox (Firefox)
    environment:
      - HOST=0.0.0.0
      - PORT=8191
      - TZ=${TZ}
    ports:
      - "${BYPARR_PORT}:8191"
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - homelab_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8191/"]
      interval: 1m
      timeout: 15s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 256M

  # ── LazyLibrarian ────────────────────────────────────────────────────────────
  # REMOVED: Replaced by Shelfmark (ebook/audiobook downloader, see below) +
  #          Komga (reader) + Calibre-Web (library manager) in media stack.
  # Data preserved at ../../data/lazylibrarian/ — delete manually once migrated.
  #
  # lazylibrarian:
  #  image: lscr.io/linuxserver/lazylibrarian:latest
  #  container_name: lazylibrarian
  #  environment:
  #   - PUID=${PUID}
  #   - PGID=${PGID}
  #   - TZ=${TZ}
  #  volumes:
  #   - ../../data/lazylibrarian/config:/config
  #   - ${DATA_ROOT}:/data
  #  ports:
  #   - "${LAZYLIBRARIAN_PORT}:5299"
  #  restart: unless-stopped
  #  networks:
  #   - homelab_net
  #  depends_on:
  #   qbittorrent:
  #    condition: service_healthy
  #  healthcheck:
  #   test: ["CMD", "curl", "-f", "http://localhost:5299"]
  #   interval: 1m
  #   timeout: 10s
  #   retries: 3
  #   start_period: 60s
  #  deploy:
  #   resources:
  #    limits:
  #     cpus: "0.5"
  #     memory: 512M
  #    reservations:
  #     cpus: "0.1"
  #     memory: 128M

  # ── Bazarr ───────────────────────────────────────────────────────────────────
  # Subtitle manager: auto-downloads subtitles for Sonarr/Radarr media.
  # Jellyfin picks up subtitle files automatically (placed alongside media files).
  #   FIRST RUN: Settings → Sonarr (host=sonarr, port=8989, API key from Sonarr UI)
  #                Settings → Radarr (host=radarr, port=7878, API key from Radarr UI)
  #                Settings → Providers → add subtitle providers (e.g. OpenSubtitles.com)
  #                Settings → Languages → select desired subtitle languages
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ../../data/bazarr/config:/config
      # Mount the full data root so Bazarr sees the same paths Radarr/Sonarr report:
      # Radarr root folder → /data/media/movies, Sonarr root folder → /data/media/tv
      - ${DATA_ROOT}:/data
    ports:
      - "${BAZARR_PORT}:6767"
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - homelab_net
      - arr_internal
    depends_on:
      radarr:
        condition: service_healthy
      sonarr:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6767/"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  # ── Unpackerr ────────────────────────────────────────────────────────────────
  # Monitors completed downloads and extracts archives for Radarr/Sonarr/Lidarr.
  # No web UI — runs silently in the background.
  unpackerr:
    image: golift/unpackerr:latest
    container_name: unpackerr
    user: "${PUID}:${PGID}"
    environment:
      - TZ=${TZ}
      - UN_SONARR_0_URL=http://sonarr:8989
      - UN_SONARR_0_API_KEY=${SONARR_API_KEY}
      - UN_RADARR_0_URL=http://radarr:7878
      - UN_RADARR_0_API_KEY=${RADARR_API_KEY}
      - UN_LIDARR_0_URL=http://lidarr:8686
      - UN_LIDARR_0_API_KEY=${LIDARR_API_KEY}
    volumes:
      - ${DATA_ROOT}:/data
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - homelab_net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M

  # ── autobrr ──────────────────────────────────────────────────────────────────
  # IRC-based torrent auto-grabber — grabs releases from IRC announce channels
  # as soon as they're announced, before RSS feeds update.
  #   FIRST RUN: log in at http://localhost:${AUTOBRR_PORT} and create your
  #     admin account, then add IRC networks + filters.
  autobrr:
    image: ghcr.io/autobrr/autobrr:latest
    container_name: autobrr
    user: "${PUID}:${PGID}"
    environment:
      - TZ=${TZ}
    volumes:
      - ../../data/autobrr/config:/config
    ports:
      - "${AUTOBRR_PORT}:7474"
    restart: unless-stopped
    networks:
      - homelab_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M

  # ── Cleanuparr ────────────────────────────────────────────────────────────────
  # Cleans up stalled, orphaned, and failed downloads from qBittorrent/Radarr/Sonarr.
  #   FIRST RUN: Configure at http://localhost:${CLEANUPARR_PORT} — add Sonarr,
  #     Radarr, and qBittorrent connection details.
  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:latest
    container_name: cleanuparr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ../../data/cleanuparr/config:/config
    ports:
      - "${CLEANUPARR_PORT}:11011"
    restart: unless-stopped
    networks:
      - homelab_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11011"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M

  # ── Profilarr ─────────────────────────────────────────────────────────────────
  # Manages and syncs quality profiles from TRaSH Guides to Radarr/Sonarr.
  # Replacement for Recyclarr — remove Recyclarr once profiles are verified.
  #   FIRST RUN: Configure at http://localhost:${PROFILARR_PORT} — add Radarr
  #     and Sonarr instances, then enable TRaSH sync.
  profilarr:
    image: santiagosayshey/profilarr:latest
    container_name: profilarr
    environment:
      - TZ=${TZ}
    volumes:
      - ../../data/profilarr/config:/config
    ports:
      - "${PROFILARR_PORT}:6868"
    restart: unless-stopped
    networks:
      - homelab_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6868"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M

  # ── Listenarr ─────────────────────────────────────────────────────────────────
  # Syncs Spotify/Last.fm listening history to Lidarr for automatic music discovery.
  # Uses the 'canary' (beta) tag — only published tag available.
  #   FIRST RUN: Configure at http://localhost:${LISTENARR_PORT} — add Lidarr
  #     connection, then link your Spotify/Last.fm account.
  listenarr:
    image: ghcr.io/listenarrs/listenarr:canary
    container_name: listenarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=022
      - TZ=${TZ}
    volumes:
      - ../../data/listenarr/config:/app/config
      - ${DATA_ROOT}/media/audiobooks:/audiobooks
      - ${DATA_ROOT}/torrents/audiobooks:/downloads/torrents
    ports:
      - "${LISTENARR_PORT}:4545"
    restart: unless-stopped
    networks:
      - homelab_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4545"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M

  # ── Youtarr ──────────────────────────────────────────────────────────────────
