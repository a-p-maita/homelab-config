services:
  prowlarr:
    image: prowlarr/prowlarr:latest
    restart: unless-stopped
    volumes:
      - ${DATA_ROOT}/prowlarr:/config
    networks:
      - backend
      - proxy_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.${DOMAIN}`)"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9696/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 64M

  radarr:
    image: linuxserver/radarr:latest
    restart: unless-stopped
    volumes:
      - ${DATA_ROOT}/radarr:/config
    networks:
      - backend
      - proxy_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`radarr.${DOMAIN}`)"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7878/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 64M

  sonarr:
    image: linuxserver/sonarr:latest
    restart: unless-stopped
    volumes:
      - ${DATA_ROOT}/sonarr:/config
    networks:
      - backend
      - proxy_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.${DOMAIN}`)"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8989/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 64M

networks:
  proxy_net:
    external: true
  backend:
    internal: true
