services:
  prowlarr:
    image: linuxserver/prowlarr@sha256:c9fe528f34b1fd3715438b6f6d6991d64e2965f2c055db36398bc66a0e7eab01
    restart: unless-stopped
    volumes:
      - ${DATA_ROOT}/prowlarr:/config
    networks:
      - backend
      - proxy_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.${DOMAIN}`)"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9696/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    cpus: "0.25"
    mem_limit: 128M
    mem_reservation: 64M
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 64M

  radarr:
    image: linuxserver/radarr@sha256:079e48870584baf2a3e7e43e7ba6d3c834555931851a59c82c51cc792d285caf
    restart: unless-stopped
    volumes:
      - ${DATA_ROOT}/radarr:/config
    networks:
      - backend
      - proxy_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`radarr.${DOMAIN}`)"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7878/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    cpus: "0.25"
    mem_limit: 128M
    mem_reservation: 64M
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 64M

  sonarr:
    image: linuxserver/sonarr@sha256:0b5c4803f92456fb9b65bae8375716ea120b4ea17b3cced7da32b63f0085782b
    restart: unless-stopped
    volumes:
      - ${DATA_ROOT}/sonarr:/config
    networks:
      - backend
      - proxy_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.${DOMAIN}`)"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8989/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    cpus: "0.25"
    mem_limit: 128M
    mem_reservation: 64M
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 64M

networks:
  proxy_net:
    external: true
  backend:
    internal: true
