  # ── Shelfmark ────────────────────────────────────────────────────────────────
  # Self-hosted book & audiobook search and download tool.
  # Multi-source: Prowlarr indexers, direct web, IRC, usenet.
  #
  # Volume layout (path must match qBittorrent exactly for torrent post-processing):
  #   /data          → ${DATA_ROOT}          shared with qBittorrent — required for
  #                                          path-matching after torrent completion
  #   /books         → media/books           ebook final delivery (INGEST_DIR)
  #   /audiobooks    → media/audiobooks      audiobook final delivery (ABS watches this)
  #
  # qBittorrent categories (pre-seeded):
  #   shelfmark-books      → /data/torrents/books      (Shelfmark processes → /books)
  #   shelfmark-audiobooks → /data/torrents/audiobooks  (Shelfmark processes → /audiobooks)
  #
  # Integrations:
  #   Calibre-Web — add library link in Settings → Library Link, and optionally
  #                 mount Calibre-Web's app.db for shared auth (see volume below).
  #   Audiobookshelf — final audiobooks land in /audiobooks = media/audiobooks,
  #                    which ABS watches. No extra config needed.
  #   FIRST RUN: Configure at http://localhost:${SHELFMARK_PORT}:
  #   1. Settings → Sources → Add Prowlarr (http://prowlarr:9696, API key)
  #   2. Settings → Sources → Add qBittorrent (http://qbittorrent:20050, credentials)
  #      Books category:      shelfmark-books
  #      Audiobook category:  shelfmark-audiobooks
  #   3. Settings → File Processing → Audiobook output path: /audiobooks
  #   4. Settings → Library Link → http://100.106.40.5:${CALIBREWEB_PORT}
  shelfmark:
    image: ghcr.io/calibrain/shelfmark:latest
    container_name: shelfmark
    user: "${PUID}:${PGID}"
    environment:
      - TZ=${TZ}
      - SEARCH_MODE=universal
      - INGEST_DIR=/books
    volumes:
      - ../../data/shelfmark/config:/config
      - ${DATA_ROOT}:/data # path-match with qBittorrent download dirs
      - ${DATA_ROOT}/media/books:/books # ebook final delivery
      - ${DATA_ROOT}/media/audiobooks:/audiobooks # audiobook final delivery (ABS watches)
      # Uncomment to reuse Calibre-Web user accounts for Shelfmark login:
      # - ../../data/calibre-web/config/app.db:/auth/app.db:ro
    ports:
      - "${SHELFMARK_PORT}:8084"
    restart: unless-stopped
    networks:
      - homelab_net
      - arr_internal
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8084/api/health"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 30s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M

networks:
  homelab_net:
    external: true
  arr_internal:
    internal: true
  youtarr_net:
    internal: true
