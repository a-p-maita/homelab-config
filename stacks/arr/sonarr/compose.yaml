services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London
    volumes:
      - ${DATA_DIR}/app_data/sonarr/data:/config
      - ${DATA_DIR}/media/tv:/tv #optional
      - ${DATA_DIR}/media/downloads:/downloads #optional
    ports:
      - 8989:8989
    restart: unless-stopped
