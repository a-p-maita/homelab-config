services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London
    volumes:
      - ${DATA_DIR}/app_data/radarr/data:/config
      - ${DATA_DIR}/media/movies:/movies #optional
      - ${DATA_DIR}/media/downloads:/downloads #optional
    ports:
      - 7878:7878
    restart: unless-stopped
