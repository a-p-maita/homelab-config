# Prometheus scrape configuration
# This file is mounted into the infrastructure stack's prometheus container.
# Reload without restart: POST http://localhost:9090/-/reload (requires --web.enable-lifecycle)

global:
 scrape_interval: 15s
 evaluation_interval: 15s
 # Attach these labels to every time series
 external_labels:
  monitor: "homelab"

scrape_configs:
 # Prometheus self-monitoring
 - job_name: "prometheus"
   static_configs:
    - targets: ["localhost:9090"]

 # Node Exporter — host hardware / OS metrics
 # node-exporter runs with network_mode: host so it is reachable on localhost
 - job_name: "node"
   static_configs:
    - targets: ["localhost:9100"]

 # Docker container metrics via cAdvisor (optional — add cAdvisor to infrastructure if desired)
 # - job_name: "cadvisor"
 #   static_configs:
 #     - targets: ["cadvisor:8080"]
