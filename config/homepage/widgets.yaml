---
# For configuration options and examples, see:
# https://gethomepage.dev/configs/info-widgets/

- datetime:
   text_size: xl
   format:
    timeStyle: short
    dateStyle: short
    hour12: false

- resources:
   label: System
   cpu: true
   memory: true
   disk: /
   uptime: true
   units: metric
   refresh: 5000

- search:
   provider: duckduckgo
   target: _blank
   focus: false
