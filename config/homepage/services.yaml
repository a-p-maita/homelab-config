# For configuration options and examples, please see:
# https://gethomepage.dev/configs/services/

# Services with a public Cloudflare tunnel — accessible from any network
# Tunnel subdomains are defined in the Caddyfile (not always the service name)
- External:
   - Jellyfin:
      href: https://jellyfin.andreasmaita.com
      description: Media server (video, music, TV)
      icon: jellyfin.png
      siteMonitor: https://jellyfin.andreasmaita.com
   - Immich:
      href: https://immich.andreasmaita.com
      description: Photo & video backup
      icon: immich.png
      siteMonitor: https://immich.andreasmaita.com
   - Audiobookshelf:
      href: https://abs.andreasmaita.com
      description: Audiobook & podcast library
      icon: audiobookshelf.png
      siteMonitor: https://abs.andreasmaita.com
   - Navidrome:
      href: https://music.andreasmaita.com
      description: Music streaming server
      icon: navidrome.png
      siteMonitor: https://music.andreasmaita.com
   - Vaultwarden:
      href: https://vault.andreasmaita.com
      description: Password manager (Bitwarden-compatible)
      icon: vaultwarden.png
      siteMonitor: https://vault.andreasmaita.com
   - Forgejo:
      href: https://git.andreasmaita.com
      description: Git hosting
      icon: forgejo.png
      siteMonitor: https://git.andreasmaita.com
   - Overseerr:
      href: https://seerr.andreasmaita.com
      description: Media request & discovery
      icon: overseerr.png
      siteMonitor: https://seerr.andreasmaita.com
   - Wizarr:
      href: https://join.andreasmaita.com
      description: Invite new users to Jellyfin
      icon: mdi-account-plus
      siteMonitor: https://join.andreasmaita.com
   - Homepage:
      href: https://homepage.andreasmaita.com
      description: This dashboard
      icon: homepage.png
      siteMonitor: https://homepage.andreasmaita.com

# Media stack — accessible over Tailscale
- Media:
   - Audiobookshelf:
      href: http://100.106.40.5:20020
      description: Audiobook & podcast library
      icon: audiobookshelf.png
      server: my-docker
      container: audiobookshelf
   - Navidrome:
      href: http://100.106.40.5:20070
      description: Music streaming server
      icon: navidrome.png
      server: my-docker
      container: navidrome
   - Feishin:
      href: http://100.106.40.5:20072
      description: Music web player
      icon: feishin.png
      server: my-docker
      container: feishin
   - Lidarr:
      href: http://100.106.40.5:20059
      description: Music collection manager
      icon: lidarr.png
      server: my-docker
      container: lidarr
      widget:
       type: lidarr
       url: http://lidarr:8686
       key: "{{HOMEPAGE_VAR_LIDARR_API_KEY}}"
   - Prowlarr:
      href: http://100.106.40.5:20055
      description: Indexer manager for all *arr apps
      icon: prowlarr.png
      server: my-docker
      container: prowlarr
      widget:
       type: prowlarr
       url: http://prowlarr:9696
       key: "{{HOMEPAGE_VAR_PROWLARR_API_KEY}}"
   - Radarr:
      href: http://100.106.40.5:20056
      description: Movie collection manager
      icon: radarr.png
      server: my-docker
      container: radarr
      widget:
       type: radarr
       url: http://radarr:7878
       key: "{{HOMEPAGE_VAR_RADARR_API_KEY}}"
       enableQueue: true
   - Sonarr:
      href: http://100.106.40.5:20057
      description: TV series collection manager
      icon: sonarr.png
      server: my-docker
      container: sonarr
      widget:
       type: sonarr
       url: http://sonarr:8989
       key: "{{HOMEPAGE_VAR_SONARR_API_KEY}}"
       enableQueue: true
   - LazyLibrarian:
      href: http://100.106.40.5:20058
      description: Book/ebook/magazine manager
      icon: mdi-book-open-page-variant
      server: my-docker
      container: lazylibrarian
   - Byparr:
      href: http://100.106.40.5:20060
      description: Cloudflare anti-bot bypass (FlareSolverr successor)
      icon: mdi-shield-check
      server: my-docker
      container: byparr
   - Octo-Fiesta:
      href: http://100.106.40.5:20076
      description: Subsonic proxy with hi-res streaming
      icon: mdi-music-circle
      server: my-docker
      container: octo-fiesta
   - qBittorrent:
      href: http://100.106.40.5:20050
      description: Torrent client
      icon: qbittorrent.png
      server: my-docker
      container: qbittorrent
      widget:
       type: qbittorrent
       url: http://qbittorrent:20050
       username: "{{HOMEPAGE_VAR_QBT_USER}}"
       password: "{{HOMEPAGE_VAR_QBT_PASS}}"
       enableLeechProgress: true
   - Audiobookbay:
      href: http://100.106.40.5:20053
      description: Audiobook downloader
      icon: mdi-book-download
      server: my-docker
      container: audiobookbay-downloader
   - Jackett:
      href: http://100.106.40.5:20054
      description: Torrent indexer proxy (legacy — use Prowlarr for new indexers)
      icon: jackett.png
      server: my-docker
      container: jackett
   - Yamtrack:
      href: http://100.106.40.5:20041
      description: Media tracker
      icon: mdi-television-play
      server: my-docker
      container: yamtrack
   - CrossWatch:
      href: http://100.106.40.5:20042
      description: Sync Trakt, AniList, Jellyfin, Plex, Simkl
      icon: mdi-sync
      server: my-docker
      container: crosswatch

