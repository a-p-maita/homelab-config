---
# For configuration options and examples, see:
# https://gethomepage.dev/configs/services/
#
# Tab layout (defined in settings.yaml):
#   External  - Cloudflare Tunnel (accessible from any network)
#   Media     - Streaming, downloads, arr automation (Tailscale / LAN)
#   Cloud     - Photos, documents, notes, code (Tailscale / LAN)
#   Services  - Finance, productivity, smart home (Tailscale / LAN)
#   System    - Monitoring and infrastructure (Tailscale / LAN)

# -------------------------------------------------------------------------
# EXTERNAL TAB - Cloudflare Tunnel services (https://*.andreasmaita.com)
# -------------------------------------------------------------------------

- "External - Media":
   - Jellyfin:
      href: https://jellyfin.andreasmaita.com
      description: Media server (video, music, TV)
      icon: jellyfin.png
      siteMonitor: https://jellyfin.andreasmaita.com
   - Audiobookshelf:
      href: https://abs.andreasmaita.com
      description: Audiobook & podcast library
      icon: audiobookshelf.png
      siteMonitor: https://abs.andreasmaita.com
   - Navidrome:
      href: https://music.andreasmaita.com
      description: Music streaming server
      icon: navidrome.png
      siteMonitor: https://music.andreasmaita.com
   - Overseerr:
      href: https://seerr.andreasmaita.com
      description: Media request & discovery
      icon: overseerr.png
      siteMonitor: https://seerr.andreasmaita.com

- "External - Cloud & Code":
   - Immich:
      href: https://immich.andreasmaita.com
      description: Photo & video backup
      icon: immich.png
      siteMonitor: https://immich.andreasmaita.com
   - Forgejo:
      href: https://git.andreasmaita.com
      description: Git hosting
      icon: forgejo.png
      siteMonitor: https://git.andreasmaita.com
   - Joplin:
      href: https://joplin.andreasmaita.com
      description: Note-taking sync server
      icon: joplin.png
      siteMonitor: https://joplin.andreasmaita.com
   - Yamtrack:
      href: https://yamtrack.andreasmaita.com
      description: Media tracker (movies/TV/games/manga)
      icon: mdi-television-play
      siteMonitor: https://yamtrack.andreasmaita.com

- "External - Services":
   - Vaultwarden:
      href: https://vault.andreasmaita.com
      description: Password manager (Bitwarden-compatible)
      icon: vaultwarden.png
      siteMonitor: https://vault.andreasmaita.com
   - Wizarr:
      href: https://join.andreasmaita.com
      description: Invite new users to Jellyfin
      icon: mdi-account-plus
      siteMonitor: https://join.andreasmaita.com
   - Homepage:
      href: https://homepage.andreasmaita.com
      description: This dashboard
      icon: homepage.png
      siteMonitor: https://homepage.andreasmaita.com

# -------------------------------------------------------------------------
# MEDIA TAB - Tailscale / LAN (http://100.106.40.5:PORT)
# -------------------------------------------------------------------------

- "Streaming & Tracking":
   - Jellyfin:
      href: http://100.106.40.5:20330
      description: Media server (video, TV)
      icon: jellyfin.png
      server: my-docker
      container: jellyfin
      widget:
       type: jellyfin
       url: http://jellyfin:8096
       key: "{{HOMEPAGE_VAR_JELLYFIN_API_KEY}}"
       enableBlocks: true
       enableNowPlaying: true
   - Overseerr:
      href: http://100.106.40.5:20331
      description: Media request & discovery
      icon: overseerr.png
      server: my-docker
      container: seerr
      widget:
       type: overseerr
       url: http://seerr:5055
       key: "{{HOMEPAGE_VAR_SEERR_API_KEY}}"
   - Audiobookshelf:
      href: http://100.106.40.5:20020
      description: Audiobook & podcast library
      icon: audiobookshelf.png
      server: my-docker
      container: audiobookshelf
   - Navidrome:
      href: http://100.106.40.5:20070
      description: Music streaming server
      icon: navidrome.png
      server: my-docker
      container: navidrome
   - Feishin:
      href: http://100.106.40.5:20072
      description: Music web player
      icon: feishin.png
      server: my-docker
      container: feishin
   - Yamtrack:
      href: http://100.106.40.5:20041
      description: Media tracker (movies/TV/games/manga)
      icon: mdi-television-play
      server: my-docker
      container: yamtrack
   - CrossWatch:
      href: http://100.106.40.5:20042
      description: Sync Trakt, AniList, Jellyfin, Simkl
      icon: mdi-sync
      server: my-docker
      container: crosswatch
   - Maintainerr:
      href: http://100.106.40.5:6246
      description: Auto-remove media from Jellyfin by rules
      icon: maintainerr.png
      server: my-docker
      container: maintainerr

- "Books & Reading":
   - Audiobookbay:
      href: http://100.106.40.5:20053
      description: Audiobook downloader
      icon: mdi-book-download
      server: my-docker
      container: audiobookbay-downloader
   - BookBounty:
      href: http://100.106.40.5:20079
      description: Ebook & audiobook downloader
      icon: mdi-book-download
      server: my-docker
      container: bookbounty
   - Calibre-Web:
      href: http://100.106.40.5:20078
      description: Ebook library manager & reader
      icon: calibre-web.png
      server: my-docker
      container: calibre-web
   - Komga:
      href: http://100.106.40.5:20077
      description: Comics & manga server
      icon: komga.png
      server: my-docker
      container: komga
   - Kiwix:
      href: http://100.106.40.5:20304
      description: Offline Wikipedia & ZIM reader
      icon: mdi-book-open-page-variant
      server: my-docker
      container: kiwix

- "Downloads":
   - qBittorrent:
      href: http://100.106.40.5:20050
      description: Torrent client
      icon: qbittorrent.png
      server: my-docker
      container: qbittorrent
      widget:
       type: qbittorrent
       url: http://qbittorrent:20050
       username: "{{HOMEPAGE_VAR_QBT_USER}}"
       password: "{{HOMEPAGE_VAR_QBT_PASS}}"
       enableLeechProgress: true
   - Autobrr:
      href: http://100.106.40.5:20074
      description: Automated torrent/Usenet release manager
      icon: autobrr.png
      server: my-docker
      container: autobrr
      widget:
       type: autobrr
       url: http://autobrr:7474
       key: "{{HOMEPAGE_VAR_AUTOBRR_API_KEY}}"
   - Youtarr:
      href: http://100.106.40.5:20080
      description: YouTube video downloader
      icon: mdi-youtube
      server: my-docker
      container: youtarr
   - Byparr:
      href: http://100.106.40.5:20060
      description: Cloudflare anti-bot bypass for indexers
      icon: mdi-shield-check
      server: my-docker
      container: byparr

- "Arr Suite":
   - Radarr:
      href: http://100.106.40.5:20056
      description: Movie collection manager
      icon: radarr.png
      server: my-docker
      container: radarr
      widget:
       type: radarr
       url: http://radarr:7878
       key: "{{HOMEPAGE_VAR_RADARR_API_KEY}}"
       enableQueue: true
   - Sonarr:
      href: http://100.106.40.5:20057
      description: TV series collection manager
      icon: sonarr.png
      server: my-docker
      container: sonarr
      widget:
       type: sonarr
       url: http://sonarr:8989
       key: "{{HOMEPAGE_VAR_SONARR_API_KEY}}"
       enableQueue: true
   - Lidarr:
      href: http://100.106.40.5:20059
      description: Music collection manager
      icon: lidarr.png
      server: my-docker
      container: lidarr
      widget:
       type: lidarr
       url: http://lidarr:8686
       key: "{{HOMEPAGE_VAR_LIDARR_API_KEY}}"
   - Prowlarr:
      href: http://100.106.40.5:20055
      description: Indexer manager for arr apps
      icon: prowlarr.png
      server: my-docker
      container: prowlarr
      widget:
       type: prowlarr
       url: http://prowlarr:9696
       key: "{{HOMEPAGE_VAR_PROWLARR_API_KEY}}"
   - Bazarr:
      href: http://100.106.40.5:20061
      description: Subtitle manager for Radarr & Sonarr
      icon: bazarr.png
      server: my-docker
      container: bazarr
      widget:
       type: bazarr
       url: http://bazarr:6767
       key: "{{HOMEPAGE_VAR_BAZARR_API_KEY}}"
   - Jackett:
      href: http://100.106.40.5:20054
      description: Torrent indexer proxy (legacy - use Prowlarr)
      icon: jackett.png
      server: my-docker
      container: jackett
   - Profilarr:
      href: http://100.106.40.5:20075
      description: Quality profile manager for arr apps
      icon: mdi-tune-variant
      server: my-docker
      container: profilarr
   - Listenarr:
      href: http://100.106.40.5:20073
      description: Auto-download music added to Jellyfin
      icon: mdi-headphones
      server: my-docker
      container: listenarr
   - Octo-Fiesta:
      href: http://100.106.40.5:20076
      description: Subsonic API proxy with hi-res streaming
      icon: mdi-music-circle
      server: my-docker
      container: octo-fiesta

