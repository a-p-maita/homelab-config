# Recyclarr main config — active profiles are in configs/ subdirectory:
#   configs/hd-bluray-web.yml  — Radarr: HD Bluray + WEB (1080p)
#   configs/web-1080p.yml      — Sonarr: WEB-1080p
#
# Manual sync:  docker compose --env-file .env -f dockerfiles/arr/compose.yaml run --rm --no-deps recyclarr sync
# Dry-run:      docker compose --env-file .env -f dockerfiles/arr/compose.yaml run --rm --no-deps recyclarr sync --dry-run
