name: productivity

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:14
    container_name: forgejo
    environment:
      - USER_UID=${PUID}
      - USER_GID=${PGID}
      - FORGEJO__database__DB_TYPE=sqlite3
      - FORGEJO__repository__ENABLE_PUSH_CREATE_USER=true
      - FORGEJO__server__ROOT_URL=https://forgejo.andreasmaita.com
      - FORGEJO__server__HTTP_ADDR=0.0.0.0
      - FORGEJO__server__HTTP_PORT=3000
      - FORGEJO__server__SSH_DOMAIN=forgejo.andreasmaita.com
      - FORGEJO__server__OFFLINE_MODE=false
    volumes:
      - ../homelab-data/forgejo:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${FORGEJO_WEB_PORT}:3000"
      - "${FORGEJO_SSH_PORT}:22"
    restart: unless-stopped
    networks:
      - homelab_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000" ]
      interval: 1m
      timeout: 10s
      retries: 3

  dufs:
    image: sigoden/dufs:latest
    container_name: dufs
    command: /data -A -a ${DUFS_auth}@/:rw
    volumes:
      - ../homelab-data/dufs:/data
    ports:
      - "${DUFS_PORT}:5000"
    restart: unless-stopped
    networks:
      - homelab_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000" ]
      interval: 1m
      timeout: 10s
      retries: 3

networks:
  homelab_net:
    external: true
