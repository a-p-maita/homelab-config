 #   - "${WORLDMONITOR_PORT}:80"
 #  networks:
 #   - homelab_net
 #  healthcheck:
 #   test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
 #   interval: 60s
 #   timeout: 10s
 #   retries: 3
 #  deploy:
 #   resources:
 #    limits:
 #     cpus: "0.5"
 #     memory: 256M

 # ── Habitica ────────────────────────────────────────────────────────────────
 # ⚠️  STOP: Habitica requires MongoDB, multiple microservices, email server
 # configuration, and complex initial setup. Not suitable for simple Docker
 # Compose. See https://github.com/HabitRPG/habitica/blob/develop/website/
 # docs/Setting-Up-Habitica-Locally.md for self-hosting instructions.
 #
 # habitica:
 #   image: habitrpg/habitica:latest
 #   # Full stack requires: mongodb, habitica-api, habitica-web + email config
 #   # Consider using the hosted service at habitica.com instead.

 # ── Invoice Ninja ────────────────────────────────────────────────────────────
 # ⚠️  STOP: Invoice Ninja requires nginx, app container, MySQL, queue worker,
 # and SMTP email configuration. See:
 # https://github.com/invoiceninja/dockerfiles for the full multi-service setup.
 #
 # invoice-ninja:
 #   image: invoiceninja/invoiceninja:latest
 #   # Requires: mysql, nginx, queue worker, SMTP config, APP_KEY generation
 #   # See dockerfiles repo for full compose example

networks:
 homelab_net:
  external: true
 personal_net:
  internal: true
