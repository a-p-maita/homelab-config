name: personal

# ─────────────────────────────────────────────────────────────────────────────
# Personal stack: recipes and meal planning
#
# Service statuses:
#   mealie       → AUTOMATED. Default admin: changeme@example.com / MyPassword.
#                  Change credentials on first login.
#
# Commented-out services:
#   habitica     → Too complex for automated setup (MongoDB + microservices +
#                  email config). See https://github.com/HabitRPG/habitica for
#                  self-hosting instructions.
#   invoice-ninja → Complex multi-service setup (app + nginx + MySQL + queue worker).
#                  See https://github.com/invoiceninja/dockerfiles for full setup.
# ─────────────────────────────────────────────────────────────────────────────

services:
 # ── Mealie ──────────────────────────────────────────────────────────────────
 # Default admin credentials: changeme@example.com / MyPassword
 # Change these immediately after first login.
 mealie:
  image: ghcr.io/mealie-recipes/mealie:latest
  container_name: mealie
  restart: unless-stopped
  ports:
   - "${MEALIE_PORT}:9000"
  environment:
   - ALLOW_SIGNUP=false
   - DEFAULT_GROUP=Home
   - BASE_URL=${MEALIE_EXTERNAL_URL}
   - TZ=Europe/London
   - PUID=${PUID}
   - PGID=${PGID}
  volumes:
   - ../../homelab-data/mealie:/app/data
  networks:
   - homelab_net
  healthcheck:
   test: ["CMD", "curl", "-f", "http://localhost:9000/api/app/about"]
   interval: 30s
   timeout: 10s
   retries: 3
   start_period: 30s
  deploy:
   resources:
    limits:
     cpus: "0.5"
     memory: 512M

 # ── Habitica ────────────────────────────────────────────────────────────────
 # ⚠️  STOP: Habitica requires MongoDB, multiple microservices, email server
 # configuration, and complex initial setup. Not suitable for simple Docker
 # Compose. See https://github.com/HabitRPG/habitica/blob/develop/website/
 # docs/Setting-Up-Habitica-Locally.md for self-hosting instructions.
 #
 # habitica:
 #   image: habitrpg/habitica:latest
 #   # Full stack requires: mongodb, habitica-api, habitica-web + email config
 #   # Consider using the hosted service at habitica.com instead.

 # ── Invoice Ninja ────────────────────────────────────────────────────────────
 # ⚠️  STOP: Invoice Ninja requires nginx, app container, MySQL, queue worker,
 # and SMTP email configuration. See:
 # https://github.com/invoiceninja/dockerfiles for the full multi-service setup.
 #
 # invoice-ninja:
 #   image: invoiceninja/invoiceninja:latest
 #   # Requires: mysql, nginx, queue worker, SMTP config, APP_KEY generation
 #   # See dockerfiles repo for full compose example

networks:
 homelab_net:
  external: true
