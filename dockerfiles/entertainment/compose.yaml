name: entertainment

# ─────────────────────────────────────────────────────────────────────────────
# Entertainment stack: Jellyfin media server
#
# Service statuses:
#   jellyfin → ⚠️  STOP: First-time setup wizard required in browser.
#              Open http://localhost:${JELLYFIN_PORT} and follow the wizard to
#              create your admin account and configure media libraries.
#
# Commented-out services:
#   peertube → Requires SMTP/email configuration + admin creation CLI command.
#              Not suitable for passwordless automated setup.
# ─────────────────────────────────────────────────────────────────────────────

services:
 # ── Jellyfin ────────────────────────────────────────────────────────────────
 # ⚠️  STOP: First-time setup wizard in browser on first visit.
 # Create admin account and add media libraries through the wizard.
 jellyfin:
  image: jellyfin/jellyfin:latest
  container_name: jellyfin
  restart: unless-stopped
  ports:
   - "${JELLYFIN_PORT}:8096"
  environment:
   - PUID=${PUID}
   - PGID=${PGID}
   - TZ=Europe/London
  volumes:
   - ../../homelab-data/jellyfin/config:/config
   - ../../homelab-data/jellyfin/cache:/cache
   # Add media mounts below as needed, e.g.:
   # - ../../homelab-data/music:/data/music:ro
   # - /path/to/movies:/data/movies:ro
   # - /path/to/tv:/data/tv:ro
  networks:
   - homelab_net
  healthcheck:
   test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
   interval: 30s
   timeout: 10s
   retries: 3
   start_period: 30s
  deploy:
   resources:
    limits:
     cpus: "2.0"
     memory: 2G
    reservations:
     cpus: "0.5"
     memory: 512M

