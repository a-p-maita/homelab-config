name: media

services:
 audiobookshelf:
  image: ghcr.io/advplyr/audiobookshelf:latest
  container_name: audiobookshelf
  ports:
   - "${ABS_PORT}:80"
  volumes:
   - ../../homelab-data/audiobookshelf/config:/config
   - ../../homelab-data/audiobookshelf/metadata:/metadata
   - ../../homelab-data/audiobooks:/audiobooks
   - ../../homelab-data/podcasts:/podcasts
  restart: unless-stopped
  networks:
   - homelab_net
  healthcheck:
   # node:alpine has no curl — use BusyBox wget
   test: ["CMD-SHELL", "wget -qO- http://localhost:80 > /dev/null"]
   interval: 1m
   timeout: 10s
   retries: 3
   start_period: 30s
  deploy:
   resources:
    limits:
     cpus: "2.0"
     memory: 2G
    reservations:
     cpus: "0.5"
     memory: 512M

 yamtrack:
  image: ghcr.io/fuzzygrim/yamtrack
  container_name: yamtrack
  restart: unless-stopped
  # ⚠️ First run: visit http://localhost:${YAMTRACK_PORT}/register to create your admin account,
  #    then set REGISTRATION=False below and run: docker compose restart yamtrack
  depends_on:
   yamtrack-redis:
    condition: service_healthy
  environment:
   - TZ=Europe/London
   - SECRET=${YAMTRACK_SECRET}
   - REDIS_URL=redis://yamtrack-redis:6379
   # URLS: comma-separated trusted origins (sets CSRF + ALLOWED_HOSTS)
   - URLS=${YAMTRACK_EXTERNAL_URL}
   # Reuse ROMM IGDB credentials (same Twitch Developer app)
   - IGDB_ID=${ROMM_IGDB_CLIENT_ID}
   - IGDB_SECRET=${ROMM_IGDB_CLIENT_SECRET}
   # TMDB_API: optional v3 API key — a default is built-in if left blank
   - TMDB_API=${YAMTRACK_TMDB_API:-}
   # Disable public registration after creating your admin account
   - REGISTRATION=False
  volumes:
   - ../../homelab-data/yamtrack:/yamtrack/db
  ports:
   - "${YAMTRACK_PORT}:8000"
  networks:
   - homelab_net
  healthcheck:
   test:
    [
     "CMD-SHELL",
     'python3 -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000'')"',
    ]
   interval: 1m
   timeout: 10s
   retries: 3
   start_period: 60s
  deploy:
   resources:
    limits:
     cpus: "1.0"
     memory: 512M
    reservations:
     cpus: "0.1"
     memory: 256M

 yamtrack-redis:
  image: redis:8-alpine
  container_name: yamtrack-redis
  restart: unless-stopped
  volumes:
   - ../../homelab-data/yamtrack/redis:/data
  networks:
   - homelab_net
  healthcheck:
   test: ["CMD", "redis-cli", "ping"]
   interval: 30s
   timeout: 10s
   retries: 3
   start_period: 15s
  deploy:
   resources:
    limits:
     cpus: "0.25"
     memory: 256M
    reservations:
     cpus: "0.05"
     memory: 64M

 qbittorrent:
  image: lscr.io/linuxserver/qbittorrent:latest
  container_name: qbittorrent
  environment:
   - PUID=${PUID}
   - PGID=${PGID}
   - TZ=Europe/London
   - WEBUI_PORT=${QBITTORRENT_WEBUI_PORT}
   - TORRENTING_PORT=${QBITTORRENT_TCP_PORT}
   - WEBUI_ADDRESS=0.0.0.0
   - WEBUI_USERNAME=${QBITTORRENT_WEBUI_USER}
  volumes:
   - ../../homelab-data/qbittorrent/config:/config
   - ../../homelab-data/qbittorrent-downloads:/downloads
   - ../../homelab-data/audiobooks:/audiobooks
  ports:
   - "${QBITTORRENT_WEBUI_PORT}:${QBITTORRENT_WEBUI_PORT}"
   - "${QBITTORRENT_TCP_PORT}:${QBITTORRENT_TCP_PORT}"
   - "${QBITTORRENT_UDP_PORT}:${QBITTORRENT_UDP_PORT}/udp"
  restart: unless-stopped
  networks:
   - homelab_net
  healthcheck:
   test: ["CMD", "curl", "-f", "http://localhost:${QBITTORRENT_WEBUI_PORT}"]
   interval: 1m
   timeout: 10s
   retries: 3
   start_period: 30s
  deploy:
   resources:
    limits:
     cpus: "2.0"
     memory: 2G
    reservations:
     cpus: "0.25"
     memory: 256M

 jackett:
  image: lscr.io/linuxserver/jackett:latest
  container_name: jackett
  environment:
   - PUID=${PUID}
   - PGID=${PGID}
   - TZ=Europe/London
   - AUTO_UPDATE=true
  volumes:
   - ../../homelab-data/jackett/config:/config
   - ../../homelab-data/jackett/downloads:/downloads
  ports:
   - "${JACKETT_PORT}:9117"
  restart: unless-stopped
  networks:
   - homelab_net
  healthcheck:
   test: ["CMD", "curl", "-f", "http://localhost:9117"]
   interval: 1m
   timeout: 10s
   retries: 3
   start_period: 60s
  deploy:
   resources:
    limits:
     cpus: "0.5"
     memory: 256M
    reservations:
     cpus: "0.05"
     memory: 128M

 audiobookbay-downloader:
  image: ghcr.io/moonblade/audiobookbay-downloader:latest
  ports:
   - "${ABB_PORT}:9000"
  container_name: audiobookbay-downloader
  depends_on:
   qbittorrent:
    condition: service_healthy
   jackett:
    condition: service_healthy
  environment:
   - JACKETT_API_URL=http://jackett:9117/api/v2.0/indexers/audiobookbay/results
   - JACKETT_API_KEY=${JACKETT_API_KEY}
   - TORRENT_CLIENT_TYPE=qbittorrent
   - QBITTORRENT_URL=http://qbittorrent:${QBITTORRENT_WEBUI_PORT}
   - QBITTORRENT_USERNAME=${QBITTORRENT_WEBUI_USER}
   - QBITTORRENT_PASSWORD=${QBITTORRENT_WEBUI_PASS}
   # Category whose save path in qBittorrent should be set to /audiobooks
   - QBITTORRENT_CATEGORY=abb-downloader
   # Persist app config (Jackett API key, settings changed via UI) across restarts
   - DB_PATH=/app/data
   # Disable auto-deletion of files — audiobooks should live in /audiobooks permanently
   - DELETE_AFTER_DAYS=365
   - STRICTLY_DELETE_AFTER_DAYS=365
  volumes:
   - ../../homelab-data/audiobookbay-downloader:/app/data
  restart: unless-stopped
  healthcheck:
   # image is Python-based — no curl available, use Python urllib
   test:
    [
     "CMD-SHELL",
     'python3 -c "import urllib.request; urllib.request.urlopen(''http://localhost:9000'')"',
    ]
   interval: 1m
   timeout: 10s
   retries: 3
   start_period: 30s
  networks:
   - homelab_net
  deploy:
   resources:
    limits:
     cpus: "0.25"
     memory: 256M
    reservations:
     cpus: "0.05"
     memory: 128M

 navidrome:
  image: deluan/navidrome:latest
  container_name: navidrome
  user: "${PUID}:${PGID}"
  environment:
   - ND_SCANSCHEDULE=1h
   - ND_LOGLEVEL=info
   # Extend session lifetime so Feishin stays logged in
   - ND_SESSIONTIMEOUT=72h
   - ND_BASEURL=
  volumes:
   - ../../homelab-data/navidrome/data:/data
   - ../../homelab-data/music:/music:ro
  ports:
   - "${NAVIDROME_PORT}:4533"
  restart: unless-stopped
  networks:
   - homelab_net
  healthcheck:
   test: ["CMD-SHELL", "wget -qO- http://localhost:4533/ping > /dev/null"]
   interval: 10s
   timeout: 5s
   retries: 3
   start_period: 30s
  deploy:
   resources:
    limits:
     cpus: "0.5"
     memory: 256M
    reservations:
     cpus: "0.05"
     memory: 64M

 feishin:
  image: ghcr.io/jeffvli/feishin:latest
  container_name: feishin
  environment:
   # Use Subsonic protocol (not navidrome) so Feishin uses standard Subsonic API
   # that octo-fiesta proxies — navidrome type uses Navidrome-specific extensions
   # that bypass octo-fiesta's enhanced endpoints (causing artist/album page failures)
   - SERVER_NAME=Homelab
   - SERVER_TYPE=subsonic
   # Must be the public URL — browser connects directly to octo-fiesta from client side
   - SERVER_URL=${OCTOFIESTA_EXTERNAL_URL}
   - SERVER_LOCK=true
   - ANALYTICS_DISABLED=true
  ports:
   - "${FEISHIN_PORT}:9180"
  restart: unless-stopped
  networks:
   - homelab_net
  depends_on:
   navidrome:
    condition: service_healthy
  healthcheck:
   test: ["CMD-SHELL", "wget -qO- http://localhost:9180 > /dev/null"]
   interval: 10s
   timeout: 5s
   retries: 3
   start_period: 20s
  deploy:
   resources:
    limits:
     cpus: "0.25"
     memory: 128M
    reservations:
     cpus: "0.05"
     memory: 32M

 lidarr:
  image: lscr.io/linuxserver/lidarr:latest
  container_name: lidarr
  environment:
   - PUID=${PUID}
   - PGID=${PGID}
   - TZ=Europe/London
  volumes:
   - ../../homelab-data/lidarr/config:/config
   # Shared with qBittorrent — same host path enables hardlinks during import
   - ../../homelab-data/qbittorrent-downloads:/downloads
   - ../../homelab-data/music:/music
  ports:
   - "${LIDARR_PORT}:8686"
  restart: unless-stopped
  networks:
   - homelab_net
  depends_on:
   qbittorrent:
    condition: service_healthy
   jackett:
    condition: service_healthy
  healthcheck:
   # /ping responds without API key
   test: ["CMD", "curl", "-f", "http://localhost:8686/ping"]
   interval: 1m
   timeout: 10s
   retries: 3
   start_period: 60s
  deploy:
   resources:
    limits:
     cpus: "1.0"
     memory: 512M
    reservations:
     cpus: "0.1"
     memory: 128M

 slskd:
  image: slskd/slskd:latest
  container_name: slskd
  environment:
   - PUID=${PUID}
   - PGID=${PGID}
   - SLSKD_REMOTE_CONFIGURATION=false
   # slskd env vars override YAML — fixes ${VAR} literal issue in slskd.yml
   - SLSKD_SOULSEEK_USERNAME=${SLSKD_USERNAME}
   - SLSKD_SOULSEEK_PASSWORD=${SLSKD_PASSWORD}
   - SLSKD_WEB_AUTHENTICATION_USERNAME=${SLSKD_USERNAME}
   - SLSKD_WEB_AUTHENTICATION_PASSWORD=${SLSKD_PASSWORD}
  volumes:
   # slskd.yml must be seeded from config-templates/slskd/slskd.yml before first boot
   - ../../homelab-data/slskd:/app
   - ../../homelab-data/music:/music
  ports:
   - "${SLSKD_PORT}:5030"
   # Soulseek P2P port — expose for better download queue priority
   - "${SLSKD_P2P_PORT}:50300"
  restart: unless-stopped
  networks:
   - homelab_net
  healthcheck:
   test: ["CMD-SHELL", "wget -qO- http://localhost:5030 > /dev/null"]
   interval: 1m
   timeout: 10s
   retries: 3
   start_period: 30s
  deploy:
   resources:
    limits:
     cpus: "0.5"
     memory: 256M
    reservations:
     cpus: "0.05"
     memory: 64M

 octo-fiesta:
  image: ghcr.io/v1ck3s/octo-fiesta:latest
  container_name: octo-fiesta
  restart: unless-stopped
  ports:
   - "${OCTOFIESTA_PORT}:8080"
  environment:
   - ASPNETCORE_ENVIRONMENT=Production
   - ASPNETCORE_URLS=http://+:8080
   # Connect to Navidrome on the internal Docker network
   - Subsonic__Url=http://navidrome:4533
   # Downloads land in the shared music library (same dir Navidrome scans)
   - Library__DownloadPath=/app/downloads
   # Provider: SquidWTF (no creds), Deezer, Qobuz, or Yandex
   - Subsonic__MusicService=${OCTOFIESTA_MUSIC_SERVICE:-SquidWTF}
   # ── Deezer ──
   - Deezer__Arl=${OCTOFIESTA_DEEZER_ARL:-}
   - Deezer__ArlFallback=${OCTOFIESTA_DEEZER_ARL_FALLBACK:-}
   - Deezer__Quality=${OCTOFIESTA_DEEZER_QUALITY:-}
   # ── Qobuz ──
   - Qobuz__UserAuthToken=${OCTOFIESTA_QOBUZ_USER_AUTH_TOKEN:-}
   - Qobuz__UserId=${OCTOFIESTA_QOBUZ_USER_ID:-}
   - Qobuz__Quality=${OCTOFIESTA_QOBUZ_QUALITY:-}
   # ── SquidWTF (free, no credentials required) ──
   - SquidWTF__Source=${OCTOFIESTA_SQUIDWTF_SOURCE:-Qobuz}
   - SquidWTF__Quality=${OCTOFIESTA_SQUIDWTF_QUALITY:-}
   # ── Yandex Music ──
   - Yandex__OAuthToken=${OCTOFIESTA_YANDEX_OAUTH_TOKEN:-}
   - Yandex__Quality=${OCTOFIESTA_YANDEX_QUALITY:-}
  volumes:
   # Read-write so downloads are saved directly into the music library
   - ../../homelab-data/music:/app/downloads
  depends_on:
   navidrome:
    condition: service_healthy
  networks:
   - homelab_net
  # No healthcheck: the .NET 9 runtime image ships without curl/wget.
  # Uptime Kuma monitors octo-fiesta via its external URL.
  deploy:
   resources:
    limits:
     cpus: "1.0"
     memory: 512M
    reservations:
     cpus: "0.1"
     memory: 128M

 crosswatch:
  image: ghcr.io/cenodude/crosswatch:latest
  container_name: crosswatch
  restart: unless-stopped
  # ⚠️ All provider accounts (Trakt, AniList, Jellyfin, Plex, Simkl, etc.)
  #    are configured entirely through the web UI — no env vars needed.
  ports:
   - "${CROSSWATCH_PORT}:8787"
  environment:
   - TZ=Europe/London
  volumes:
   - ../../homelab-data/crosswatch:/config
  networks:
   - homelab_net
  healthcheck:
   test: ["CMD-SHELL", "wget -qO- http://localhost:8787 > /dev/null"]
   interval: 1m
   timeout: 10s
   retries: 3
   start_period: 60s
  deploy:
   resources:
    limits:
     cpus: "0.5"
     memory: 512M
    reservations:
     cpus: "0.1"
     memory: 128M

networks:
 homelab_net:
  external: true
