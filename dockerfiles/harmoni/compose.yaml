name: harmoni

# Harmoni is an interactive CLI download tool — NOT a persistent daemon.
#
# Usage (run on demand, then exit):
#   docker compose --env-file ../.env -f harmoni/compose.yaml run --rm harmoni
#
# First-time setup:
#   1. Clone the harmoni repo into homelab-data:
#        git clone https://github.com/Ssenseii/harmoni.git ../homelab-data/harmoni
#   2. Copy and configure the config file:
#        cp ../homelab-data/harmoni/config.example.json ../homelab-data/harmoni/config.json
#        # Edit config.json — set spotify_client_id, spotify_client_secret,
#        # spotify_redirect_uri (http://127.0.0.1:8888/callback), and
#        # ytdlp_output_template to point to /app/music/{template}
#   3. Build the image (only needed once, or after harmoni updates):
#        docker compose --env-file ../.env -f harmoni/compose.yaml build
#   4. Run:
#        docker compose --env-file ../.env -f harmoni/compose.yaml run --rm harmoni

services:
  harmoni:
    build:
      context: ../homelab-data/harmoni
      dockerfile: Dockerfile
    container_name: harmoni
    # Interactive CLI app — keep STDIN + TTY attached
    stdin_open: true
    tty: true
    # Spotify OAuth PKCE loopback callback (must match spotify_redirect_uri in config.json)
    ports:
      - "8888:8888"
    volumes:
      # App state (session tokens, cache)
      - ../homelab-data/harmoni/data:/app/data
      # Shared music library — downloads land here alongside Navidrome's library
      - ../homelab-data/music:/app/music
      # Export directory (Spotify CSV exports, playlists)
      - ../homelab-data/harmoni/export:/app/export
      # Config file with Spotify credentials
      - ../homelab-data/harmoni/config.json:/app/config.json:ro
    networks:
      - homelab_net

networks:
  homelab_net:
    external: true
