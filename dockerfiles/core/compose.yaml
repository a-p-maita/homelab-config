name: core

services:
 cloudflared:
  image: cloudflare/cloudflared:latest
  container_name: cloudflared
  restart: unless-stopped
  # --metrics enables the health/ready endpoint on port 8080
  command: tunnel --metrics 0.0.0.0:8080 run
  environment:
   - TUNNEL_TOKEN=${TUNNEL_TOKEN}
  ports:
   - "${CLOUDFLARED_PORT}:8080"
  networks:
   - homelab_net
  healthcheck:
   # Distroless image: no shell/curl. --version exits 0 if the binary is alive.
   # Tunnel connectivity is visible in logs; real monitoring via Uptime Kuma.
   test: ["CMD", "cloudflared", "--version"]
   interval: 1m
   timeout: 10s
   retries: 3
   start_period: 30s
  deploy:
   resources:
    limits:
     cpus: "0.25"
     memory: 128M
    reservations:
     cpus: "0.05"
     memory: 64M

networks:
 homelab_net:
  external: true
