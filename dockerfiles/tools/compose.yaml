name: tools

# ─────────────────────────────────────────────────────────────────────────────
# Tools stack: developer and productivity tools
#
# Service statuses:
#   code-server     → AUTOMATED. Accessible via browser, password-protected.
#   draw.io         → AUTOMATED. No auth — internal/Tailscale only.
#   excalidraw      → AUTOMATED. No auth — internal/Tailscale only.
#   it-tools        → AUTOMATED. No auth — internal/Tailscale only.
#   libreoffice     → AUTOMATED. KasmVNC web UI on port 3000.
#   vaultwarden     → AUTOMATED. ADMIN_TOKEN must be an Argon2/bcrypt hash.
#                    Generate: docker run --rm -it vaultwarden/server \
#                      /vaultwarden hash --preset owasp
#   actual-budget   → AUTOMATED. No initial auth required.
#   joplin          → ⚠️  STOP: Start the stack, then visit the UI and change
#                    the default admin credentials (admin@localhost / admin).
#   job-ops         → ⚠️  STOP: First-time onboarding wizard required.
#                    Open http://localhost:${JOB_OPS_PORT} and follow the wizard
#                    to set up your AI provider, job board credentials, and profile.
#
# Commented-out services below require manual configuration before enabling:
#   nginx-proxy-manager → Redundant with Cloudflared tunnel; enable only if
#                         you need reverse-proxy for local traffic routing.
#   authelia            → Requires authelia YAML config files (see comments).
#   authentik           → Requires postgres + redis + worker setup (see comments).
# ─────────────────────────────────────────────────────────────────────────────

services:
 # ── Code Server ─────────────────────────────────────────────────────────────
 code-server:
  image: lscr.io/linuxserver/code-server:latest
  container_name: code-server
  restart: unless-stopped
  ports:
   - "${CODE_SERVER_PORT}:8443"
  environment:
   - PUID=${PUID}
   - PGID=${PGID}
   - TZ=Europe/London
   - PASSWORD=${CODE_SERVER_PASSWORD}
   - SUDO_PASSWORD=${CODE_SERVER_SUDO_PASSWORD}
   - DEFAULT_WORKSPACE=/config/workspace
  volumes:
   - ../../homelab-data/code-server/config:/config
  networks:
   - homelab_net
  healthcheck:
   test: ["CMD", "curl", "-f", "http://localhost:8443"]
   interval: 30s
   timeout: 10s
   retries: 3
   start_period: 30s
  deploy:
   resources:
    limits:
     cpus: "2.0"
     memory: 2G
    reservations:
     cpus: "0.25"
     memory: 256M

 # ── Draw.io ─────────────────────────────────────────────────────────────────
 drawio:
  image: jgraph/drawio:latest
  container_name: drawio
  restart: unless-stopped
  ports:
   - "${DRAWIO_PORT}:8080"
  networks:
   - homelab_net
  healthcheck:
   test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080"]
   interval: 60s
   timeout: 10s
   retries: 3
  deploy:
   resources:
    limits:
     cpus: "0.5"
     memory: 512M

 # ── Excalidraw ──────────────────────────────────────────────────────────────
 excalidraw:
  image: excalidraw/excalidraw:latest
  container_name: excalidraw
  restart: unless-stopped
  ports:
   - "${EXCALIDRAW_PORT}:80"
  networks:
   - homelab_net
  healthcheck:
   test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
   interval: 60s
   timeout: 10s
   retries: 3
  deploy:
   resources:
    limits:
     cpus: "0.5"
     memory: 256M

 # ── IT-Tools ────────────────────────────────────────────────────────────────
 it-tools:
  image: corentinth/it-tools:latest
  container_name: it-tools
  restart: unless-stopped
  ports:
   - "${IT_TOOLS_PORT}:80"
  networks:
   - homelab_net
  healthcheck:
   test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
   interval: 60s
   timeout: 10s
   retries: 3
  deploy:
   resources:
    limits:
     cpus: "0.25"
     memory: 128M

 # ── LibreOffice (KasmVNC web desktop) ───────────────────────────────────────
 libreoffice:
  image: lscr.io/linuxserver/libreoffice:latest
  container_name: libreoffice
  restart: unless-stopped
  ports:
   - "${LIBREOFFICE_PORT}:3000"
  environment:
   - PUID=${PUID}
   - PGID=${PGID}
   - TZ=Europe/London
  volumes:
   - ../../homelab-data/libreoffice/config:/config
  networks:
   - homelab_net
  healthcheck:
   test: ["CMD", "curl", "-f", "http://localhost:3000"]
   interval: 30s
   timeout: 10s
   retries: 3
   start_period: 30s
  deploy:
   resources:
    limits:
     cpus: "1.0"
     memory: 1G

 # ── Vaultwarden ─────────────────────────────────────────────────────────────
 vaultwarden:
  image: vaultwarden/server:latest
  container_name: vaultwarden
  restart: unless-stopped
  ports:
   - "${VAULTWARDEN_PORT}:80"
  environment:
   # ADMIN_TOKEN must be an Argon2 hash. Generate with:
   #   docker run --rm -it vaultwarden/server /vaultwarden hash --preset owasp
   - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
   - SIGNUPS_ALLOWED=false
   - WEBSOCKET_ENABLED=true
   - DOMAIN=${VAULTWARDEN_EXTERNAL_URL}
   - LOG_LEVEL=warn
  volumes:
   - ../../homelab-data/vaultwarden:/data
  networks:
   - homelab_net
  healthcheck:
   test: ["CMD", "curl", "-f", "http://localhost:80/alive"]
   interval: 30s
   timeout: 10s
   retries: 3
   start_period: 10s
  deploy:
   resources:
    limits:
     cpus: "0.5"
     memory: 256M

 # ── Actual Budget ───────────────────────────────────────────────────────────
 actual-budget:
  image: actualbudget/actual-server:latest
  container_name: actual-budget
  restart: unless-stopped
  ports:
   - "${ACTUAL_BUDGET_PORT}:5006"
  volumes:
   - ../../homelab-data/actual-budget:/data
  networks:
   - homelab_net
  healthcheck:
   test: ["CMD", "wget", "-q", "--spider", "http://localhost:5006"]
   interval: 60s
   timeout: 10s
   retries: 3
   start_period: 10s
  deploy:
   resources:
    limits:
     cpus: "0.5"
     memory: 256M

 # ── Joplin Server ───────────────────────────────────────────────────────────
 # ⚠️  STOP: After first start, log in at http://localhost:${JOPLIN_PORT}
 # with default credentials admin@localhost / admin and change the password
 # immediately. Then configure your Joplin clients to sync to this server.
 joplin-postgres:
  image: postgres:16-alpine
  container_name: joplin-postgres
  restart: unless-stopped
  environment:
   - POSTGRES_USER=${JOPLIN_DB_USER}
   - POSTGRES_PASSWORD=${JOPLIN_DB_PASS}
   - POSTGRES_DB=joplin
  volumes:
   - ../../homelab-data/joplin/db:/var/lib/postgresql/data
  networks:
   - tools_net
  healthcheck:
   test: ["CMD-SHELL", "pg_isready -U ${JOPLIN_DB_USER} -d joplin"]
   interval: 30s
   timeout: 10s
   retries: 5
   start_period: 30s
  deploy:
   resources:
    limits:
     cpus: "0.5"
     memory: 256M

 joplin:
  image: joplin/server:latest
  container_name: joplin
  restart: unless-stopped
  depends_on:
   joplin-postgres:
    condition: service_healthy
  ports:
   - "${JOPLIN_PORT}:22300"
  environment:
   - APP_BASE_URL=${JOPLIN_EXTERNAL_URL}
   - APP_PORT=22300
   - DB_CLIENT=pg
   - POSTGRES_PASSWORD=${JOPLIN_DB_PASS}
   - POSTGRES_DATABASE=joplin
   - POSTGRES_USER=${JOPLIN_DB_USER}
   - POSTGRES_PORT=5432
   - POSTGRES_HOST=joplin-postgres
  networks:
   - homelab_net
   - tools_net
  healthcheck:
   test: ["CMD", "wget", "-q", "--spider", "http://localhost:22300"]
   interval: 30s
   timeout: 10s
   retries: 3
   start_period: 30s
  deploy:
   resources:
    limits:
     cpus: "0.5"
     memory: 256M

 # ── Job Ops ─────────────────────────────────────────────────────────────────
 # ⚠️  STOP: First-time onboarding wizard required.
 # Open http://localhost:${JOB_OPS_PORT} and follow the wizard to configure
 # your AI provider (OpenAI / Gemini / OpenRouter / Ollama), resume, and
 # job board search preferences. Wizard takes ~5-10 minutes.
 job-ops:
  image: ghcr.io/dakheera47/job-ops:latest
  container_name: job-ops
  restart: unless-stopped
  ports:
   - "${JOB_OPS_PORT}:3005"
  volumes:
   - ../../homelab-data/job-ops:/app/data
  networks:
   - homelab_net
  deploy:
   resources:
    limits:
     cpus: "1.0"
     memory: 1G

 # ── MeshCentral ─────────────────────────────────────────────────────────────
 # ⚠️  STOP: First-time setup wizard in browser. After starting, visit
 # http://localhost:${MESHCENTRAL_PORT} and create an admin account.
 # Then install MeshAgent on devices you want to manage.
 meshcentral:
  image: typhonragewind/meshcentral:latest
  container_name: meshcentral
  restart: unless-stopped
  ports:
   - "${MESHCENTRAL_PORT}:443"
   - "${MESHCENTRAL_HTTP_PORT}:80"
  volumes:
   - ../../homelab-data/meshcentral/data:/opt/meshcentral/meshcentral-data
   - ../../homelab-data/meshcentral/user-files:/opt/meshcentral/meshcentral-files
   - ../../homelab-data/meshcentral/backups:/opt/meshcentral/meshcentral-backups
  networks:
   - homelab_net
  deploy:
   resources:
    limits:
     cpus: "0.5"
     memory: 512M

