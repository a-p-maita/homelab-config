security:
 enableLogin: true
 loginAttemptCount: 5
 loginResetTimeMinutes: 120
 loginMethod: all
 initialLogin:
  username: "" # Set before first start, or configure via SECURITY_INITIALLOGIN_USERNAME env var
  password: "" # Set before first start, or configure via SECURITY_INITIALLOGIN_PASSWORD env var

system:
 defaultLocale: en-US
 googlevisibility: false
 showUpdate: false
 enableAnalytics: false
 enablePosthog: false
 enableScarf: false
 enableUrlToPDF: false # Keep false — known security issues
 disableSanitize: false

ui:
 appNameNavbar: "Stirling PDF"
 logoStyle: classic
 defaultHideUnavailableTools: false

metrics:
 enabled: true

mail:
 enabled: false

premium:
 key: 00000000-0000-0000-0000-000000000000
 enabled: false
