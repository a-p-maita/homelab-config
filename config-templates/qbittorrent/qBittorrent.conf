# qBittorrent configuration template
# Copy to: homelab-data/qbittorrent/config/qBittorrent/qBittorrent.conf
#
# Key non-default settings explained:
#   WebUI\CSRFProtection=false        — required when accessing via reverse proxy / Tailscale
#   WebUI\HostHeaderValidation=false  — required when accessing via non-localhost hostname
#   WebUI\SecureCookie=false          — required when WebUI is served over plain HTTP
#   Session\DisableAutoTMMByDefault=false — enables Auto Torrent Management so category
#                                           save paths (e.g. /audiobooks) are respected

[Application]
FileLogger\Age=1
FileLogger\AgeType=1
FileLogger\Backup=true
FileLogger\DeleteOld=true
FileLogger\Enabled=true
FileLogger\MaxSizeBytes=66560
FileLogger\Path=/config/qBittorrent/logs

[AutoRun]
enabled=false
program=

[BitTorrent]
Session\AddTorrentStopped=false
Session\DefaultSavePath=/data/torrents/
Session\DisableAutoTMMByDefault=false
Session\ExcludedFileNames=
Session\GlobalMaxRatio=0
Session\GlobalMaxSeedingMinutes=0
Session\Port=20051
Session\QueueingSystemEnabled=true
Session\SSL\Port=54304
Session\ShareLimitAction=Stop
Session\TempPath=/data/torrents/incomplete/

[Core]
AutoDeleteAddedTorrentFile=Never

[LegalNotice]
Accepted=true

[Meta]
MigrationVersion=8

[Network]
PortForwardingEnabled=false
Proxy\HostnameLookupEnabled=false
Proxy\Profiles\BitTorrent=true
Proxy\Profiles\Misc=true
Proxy\Profiles\RSS=true

[Preferences]
Connection\PortRangeMin=6881
Connection\UPnP=false
Downloads\SavePath=/data/torrents/
Downloads\TempPath=/data/torrents/incomplete/
General\Locale=en
MailNotification\req_auth=true
WebUI\Address=*
WebUI\CSRFProtection=false
WebUI\HostHeaderValidation=false
WebUI\Port=20050
WebUI\SecureCookie=false
WebUI\ServerDomains=*
WebUI\Username=your_username
# WebUI\Password_PBKDF2 is set automatically by qBittorrent on first login —
# do not set it here. Configure your password via the WebUI after first start.

[RSS]
AutoDownloader\DownloadRepacks=true
AutoDownloader\SmartEpisodeFilter=s(\\d+)e(\\d+), (\\d+)x(\\d+), "(\\d{4}[.\\-]\\d{1,2}[.\\-]\\d{1,2})", "(\\d{1,2}[.\\-]\\d{1,2}[.\\-]\\d{4})"
