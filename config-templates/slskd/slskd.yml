# slskd configuration template
# Copy to homelab-data/slskd/slskd.yml BEFORE first boot.
#
# Credentials are passed via environment variables in compose.yaml (SLSKD_USERNAME /
# SLSKD_PASSWORD) which map to the SLSKD_SOULSEEK_* and SLSKD_WEB_AUTHENTICATION_*
# env vars — no credentials needed in this file.
#
# Only directory paths are configured here since they cannot be set via env vars.

directories:
  # Downloads go directly into the shared music library so Navidrome picks them up
  downloads: /music
  # Incomplete downloads stay in the app dir, out of Navidrome's watch path
  incomplete: /app/incomplete
